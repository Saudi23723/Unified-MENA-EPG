name: Update Turkey Extra Sports EPG (EXXEN/Tivibu/beIN Connect)

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches:
      - main
    paths:
      - "turkish_extra_sports_epg.py"
      - "epg_lib.py"
      - ".github/workflows/update_turkish_extra_sports_epg.yml"

permissions:
  contents: write

concurrency:
  group: turkish-extra-sports-epg
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Turkey Extra Sports EPG
        run: python turkish_extra_sports_epg.py

      - name: Validate XMLTV
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse("turkish_extra_sports_epg.xml").getroot()
          assert root.tag == "tv"
          assert root.find("channel") is not None
          print("TURKEY EXTRA SPORTS XMLTV VALIDATION PASS")
          PY

      - name: Commit updated EPG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add turkish_extra_sports_epg.xml

          if git diff --cached --quiet; then
            echo "No Turkey Extra Sports EPG changes to commit."
            exit 0
          fi

          git commit -m "Update Turkey Extra Sports EPG (EXXEN/Tivibu/beIN Connect)"
          git pull --rebase origin main
          git push origin main
