name: Probe — every row jfa.jo publishes
on:
  push:
    paths:
      - "tools/probe_jordan_rows.py"
      - ".github/workflows/probe_jordan_rows.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -u tools/probe_jordan_rows.py
