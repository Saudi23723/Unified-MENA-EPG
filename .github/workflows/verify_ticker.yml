name: Verify the ticker
on:
  push:
    paths:
      - ".github/workflows/verify_ticker.yml"
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ara tesseract-ocr-eng
      - run: pip install -r requirements.txt
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Two passes, seven minutes apart, publishing each
        run: python -u tools/verify_ticker.py
      - name: What landed on this branch
        if: always()
        run: |
          git log --oneline -5
          echo "--- commits this run made ---"
          git log --oneline --since="35 minutes ago" | grep -c "Update every EPG" || echo 0
