name: SAUDI.TV preview copy

# A copy of the app with another package name (com.saudi1.tv.preview), to see a brand-new install
# (activation, payment, promo code) on a TV that already has the real app. Not published: an artifact only.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: saudi1-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - name: Find the FFmpeg sound decoder for this Media3 version
        run: |
          M=$(grep -o 'media3-exoplayer:[0-9.]*' saudi1/app/build.gradle.kts | head -1 | cut -d: -f2)
          curl -s https://repo1.maven.org/maven2/org/jellyfin/media3/media3-ffmpeg-decoder/maven-metadata.xml | grep -o '<version>[^<]*' | sed 's/<version>//' | tee /tmp/ff.txt
          V=$(grep "^$M+" /tmp/ff.txt | tail -1)
          echo "FFMPEG_VER=$V" >> $GITHUB_ENV
      - name: Build
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          APP_SUFFIX: ".preview"
        run: gradle -p saudi1 assembleRelease --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: saudi1-preview
          path: saudi1/app/build/outputs/apk/release/app-release.apk
          retention-days: 3
