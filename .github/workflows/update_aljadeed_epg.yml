name: Update Al Jadeed EPG

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "aljadeed_epg.py"
      - ".github/workflows/update_aljadeed_epg.yml"

  # Al Jadeed publishes a week of dated pages, so this does not need to
  # chase a rolling day — a few times a day keeps the week fresh and the
  # clock re-measured.
  schedule:
    - cron: "25 */4 * * *"

permissions:
  contents: write

concurrency:
  group: aljadeed-epg
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build XMLTV
        run: python aljadeed_epg.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add aljadeed_epg.xml

          if git diff --cached --quiet; then
            echo "No Al Jadeed EPG changes to commit."
            exit 0
          fi

          git commit -m "Update Al Jadeed EPG"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin main; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push rejected (another workflow pushed first), retrying ($attempt/5)..."
            sleep $(( (RANDOM % 5) + 2 ))
          done
          echo "Failed to push after 5 attempts"
          exit 1
