name: Turkish channels get the Turkish guide

# Turkish playlist channels without a guide are matched, by exact cleaned name, to this repository's own Turkish
# guides and the owner's Turkey link (tools/turkey_epg_match.py). Run by hand; the maps it changes are committed.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  match:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Match
        run: python tools/turkey_epg_match.py
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add xtream/*/channel_map.json turkey_epg_report.txt
          git diff --cached --quiet && exit 0
          git commit -m "Turkish channels: guides from the Turkish EPG"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 5; done
          exit 1
