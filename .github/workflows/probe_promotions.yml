# Ask PFL, Most Valuable Promotions, Netflix and ESPN what they publish,
# before a line of reader is written for any of them.
# It commits nothing and publishes nothing.
name: Probe the promotions

on:
  workflow_dispatch:
  push:
    branches: [claude/arabic-channels-epg-99099k]
    paths:
      - "probes/probe_promotions.py"
      - ".github/workflows/probe_promotions.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -u probes/probe_promotions.py
