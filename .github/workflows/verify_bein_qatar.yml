name: Verify beIN Qatar EPG (branch only)
on:
  push:
    branches: [claude/arabic-channels-epg-99099k]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -u bein_sports_qatar_epg.py 2>&1 | tail -25
      - name: Count the badges
        run: |
          python -u - <<'PY'
          import xml.etree.ElementTree as ET
          BADGE = "\U0001F535"
          root = ET.parse("bein_sports_qatar_epg.xml").getroot()
          progs = root.findall("programme")
          live = [p for p in progs if BADGE in (p.find("title").text or "")]
          print(f"{len(root.findall('channel'))} channels, {len(progs)} programmes, "
                f"{len(live)} badged live")
          PY
