name: Verify beIN Qatar EPG (branch only)
on:
  push:
    branches: [claude/arabic-channels-epg-99099k]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -u bein_sports_qatar_epg.py
      - name: Inspect the result
        run: |
          python -u - <<'PY'
          import xml.etree.ElementTree as ET
          from collections import defaultdict
          from datetime import datetime

          BADGE = "\U0001F535"
          root = ET.parse("bein_sports_qatar_epg.xml").getroot()
          names = {c.get("id"): c.find("display-name").text for c in root.findall("channel")}
          tot, live = defaultdict(int), defaultdict(int)
          for p in root.findall("programme"):
              ch = p.get("channel")
              tot[ch] += 1
              if BADGE in (p.find("title").text or ""):
                  live[ch] += 1
              s = datetime.strptime(p.get("start"), "%Y%m%d%H%M%S %z")
              e = datetime.strptime(p.get("stop"), "%Y%m%d%H%M%S %z")
              assert e > s, f"bad duration on {ch}"

          for ch in sorted(tot, key=lambda c: -tot[c]):
              print(f"  {names.get(ch, ch):24} {tot[ch]:4} programmes  {live[ch]:3} live")

          days = sorted({p.get("start")[:8] for p in root.findall("programme")})
          print(f"\ntotals: {len(tot)} channels, {sum(tot.values())} programmes, "
                f"{sum(live.values())} live")
          print(f"days covered: {days[0]} .. {days[-1]} ({len(days)} days)")
          PY
