name: Update Filler EPG

on:
  workflow_dispatch:
  schedule:
    # The grid is computed, not fetched, so once a day is enough — it only
    # needs to roll the window forward.
    - cron: "40 4 * * *"
  push:
    branches:
      - main
    paths:
      - "filler_epg.py"
      - "epg_lib.py"
      - ".github/workflows/update_filler_epg.yml"

permissions:
  contents: write

concurrency:
  group: filler-epg
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Filler EPG
        run: python filler_epg.py

      - name: Commit updated Filler EPG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add filler_epg.xml

          if git diff --cached --quiet; then
            echo "No Filler EPG changes to commit."
            exit 0
          fi

          git commit -m "Update Filler EPG"

          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin main; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push rejected (another workflow pushed first), retrying ($attempt/5)..."
            sleep $(( (RANDOM % 5) + 2 ))
          done
          echo "Failed to push after 5 attempts"
          exit 1
