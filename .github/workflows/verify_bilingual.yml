name: Verify bilingual filters
on:
  push:
    paths:
      - ".github/workflows/verify_bilingual.yml"
      - "epg_lib.py"
      - "update_shahid_sports_epg.py"
      - "JORDAN_SPORTS_FINAL_VERIFIED.py"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python -u epg_lib_selftest.py
      - run: python -u channel_gate_selftest.py
      - run: python -u update_shahid_sports_epg.py
      - name: Is the competition kept now, and is every fixture still here?
        if: always()
        run: |
          python - <<'PY'
          import re, subprocess, xml.etree.ElementTree as ET
          def fixtures(blob):
              out, comps = set(), set()
              for p in ET.fromstring(blob).findall("programme"):
                  t = re.sub(r"\s*·.*$", "", (p.findtext("title") or ""))
                  t = t.replace("‎", "").replace("• Live 🔵", "").replace("⏰", "").strip()
                  if t and "لا توجد" in t:
                      continue
                  for piece in t.split(" + "):
                      if " - " in piece:
                          out.add(piece.strip())
                  for line in (p.findtext("desc") or "").split("\n"):
                      if " — " in line:
                          comps.add(line.split(" — ", 1)[1].strip())
              return out, comps
          was, _ = fixtures(subprocess.run(
              ["git", "show", "HEAD:shahid_sports_epg.xml"],
              capture_output=True).stdout)
          now, comps = fixtures(open("shahid_sports_epg.xml", "rb").read())
          print(f"fixtures before {len(was)}   after {len(now)}")
          print(f"no longer published: {sorted(was - now) or 'none'}")
          print(f"newly published    : {sorted(now - was) or 'none'}")
          print(f"\ncompetitions now named in the guide ({len(comps)}):")
          for c in sorted(comps):
              print("   ", c)
          PY
      - if: always()
        run: python -u health_check.py || echo "health_check exit $?"
