name: Probe — WRC, and the duplicated card
on:
  push:
    paths:
      - "probes/probe_wrc_and_the_duplicate.py"
      - ".github/workflows/probe_wrc.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -u probes/probe_wrc_and_the_duplicate.py
