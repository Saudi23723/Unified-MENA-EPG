name: Update Thmanyah EPG

on:
  workflow_dispatch:

  schedule:
    - cron: "17 */3 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Build Thmanyah XMLTV
        run: |
          python update_thmanyah_epg.py

      - name: Commit Thmanyah EPG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add thmanyah_epg.xml

          if git diff --cached --quiet; then
            echo "No Thmanyah EPG changes to commit."
            exit 0
          fi

          git commit -m "Update Thmanyah EPG"
          git pull --rebase origin main
          git push origin main
