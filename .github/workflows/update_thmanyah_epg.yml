name: Update Thamanya EPG

on:
  workflow_dispatch:
  schedule:
    - cron: "20 15 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Generate Thamanya EPG
        run: |
          python update_thmanyah_epg.py

      - name: Validate XML
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse("thmanyah_epg.xml")
          print("thamanya_epg.xml XML validation: PASS")
          PY

      - name: Commit updated EPG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add thmanyah_epg.xml
          git diff --cached --quiet || git commit -m "Update Thamanya EPG"
          git pull --rebase origin main
          git push origin main
