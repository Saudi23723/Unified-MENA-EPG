name: Update Thamanya EPG

on:
  workflow_dispatch:
  schedule:
    # كل 3 ساعات: أرقام القنوات غالباً تُعلن متأخرة قبل المباراة بساعات
    - cron: "20 */3 * * *"

permissions:
  contents: write

concurrency:
  group: thmanyah-epg
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ara
          pip install requests beautifulsoup4 pillow pytesseract lxml

      - name: Generate Thamanya EPG
        run: |
          python update_thmanyah_epg.py

      - name: Validate XML
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("thmanyah_epg.xml").getroot()
          channels = [c.get("id") for c in root.findall("channel")]
          assert len(channels) == 4, channels
          print("thmanyah_epg.xml XML validation: PASS |", len(root.findall("programme")), "programmes")
          PY

      - name: Commit updated EPG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add thmanyah_epg.xml
          git diff --cached --quiet || git commit -m "Update Thamanya EPG"
          git pull --rebase origin main
          git push origin main
