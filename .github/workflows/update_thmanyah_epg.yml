name: Update Thamanya EPG

on:
  # Scheduled builds all live in one workflow now — "Build every EPG",
  # which runs this guide's generator along with every other one. See
  # build_all_epg.py for why: fifteen separate crons had GitHub delaying
  # and dropping this repository's scheduled events for hours at a time.
  #
  # This file is kept as the way to rebuild THIS guide on its own, by
  # hand, when something about it needs looking at. It is not part of the
  # regular schedule and nothing chains to it.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: thmanyah-epg
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ملاحظة: حزم tesseract تُثبَّت فقط عند تفعيل ENABLE_TELEGRAM_OCR.
      - name: Install OCR engine (only if enabled)
        run: |
          if grep -q "^ENABLE_TELEGRAM_OCR = True" update_thmanyah_epg.py; then
            sudo apt-get update
            sudo apt-get install -y tesseract-ocr tesseract-ocr-ara
          else
            echo "Telegram OCR disabled; skipping tesseract install"
          fi

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 pillow pytesseract lxml

      - name: Generate Thamanya EPG
        run: |
          python update_thmanyah_epg.py

      - name: Validate XML
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("thmanyah_epg.xml").getroot()
          channels = [c.get("id") for c in root.findall("channel")]
          assert len(channels) == 4, channels
          print("thmanyah_epg.xml XML validation: PASS |", len(root.findall("programme")), "programmes")
          PY

      - name: Commit updated EPG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add thmanyah_epg.xml
          git diff --cached --quiet || git commit -m "Update Thamanya EPG"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin main; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push rejected (another workflow pushed first), retrying ($attempt/5)..."
            sleep $(( (RANDOM % 5) + 2 ))
          done
          echo "Failed to push after 5 attempts"
          exit 1
