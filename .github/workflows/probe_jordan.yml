name: Shahid — find the channels and their EPG
on:
  push:
    branches: [claude/arabic-channels-epg-99099k]
    paths: ['.github/workflows/probe_jordan.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q requests
      - name: Probe
        run: |
          python -u - <<'PY'
          import json, re
          from datetime import datetime, timezone
          import requests
          H = {"User-Agent": ("Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 "
                              "(KHTML, like Gecko) Chrome/126.0 Safari/537.36"),
               "Accept": "application/json", "Origin": "https://shahid.mbc.net",
               "Referer": "https://shahid.mbc.net/"}
          API = "https://api2.shahid.net/proxy/v2"

          def get(path, req=None, **extra):
              p = dict(extra)
              if req is not None: p["request"] = json.dumps(req, ensure_ascii=False)
              try:
                  return requests.get(API + path, headers=H, params=p, timeout=25)
              except Exception as e:
                  print(f"      ERR {type(e).__name__}: {str(e)[:60]}")
                  return None

          print("=" * 86)
          print("A) walk LIVESTREAM ids and see which are real MBC channels")
          print("=" * 86)
          live = []
          for cid in range(1, 61):
              r = get("/product/id", {"id": str(cid), "productType": "LIVESTREAM",
                                      "productSubType": "LIVE_CHANNEL"})
              if r is None or r.status_code != 200: continue
              try: d = r.json()
              except Exception: continue
              pm = d.get("productModel") or {}
              title = (pm.get("title") or "").strip()
              if title:
                  live.append((cid, title))
                  print(f"   id={cid:<4} {title:<34} country={d.get('country')}")
          print(f"\n   channels with a title: {len(live)}")

          print("\n" + "=" * 86)
          print("B) is there an EPG for one of them")
          print("=" * 86)
          probe_id = live[0][0] if live else 1
          for path, req in [
              ("/product/epg", {"id": str(probe_id), "productType": "LIVESTREAM"}),
              ("/livestream/epg", {"id": str(probe_id)}),
              ("/epg", {"channelId": str(probe_id)}),
              ("/product/livestream/epg", {"id": str(probe_id)}),
              ("/page/livestream", {"id": str(probe_id), "pageNumber": 0, "pageSize": 50}),
              ("/product/id", {"id": str(probe_id), "productType": "LIVESTREAM",
                               "productSubType": "LIVE_CHANNEL", "includeEpg": True}),
          ]:
              r = get(path, req, country="SA", language="ar")
              if r is None: continue
              body = (r.text or "")[:260]
              has_epg = any(k in (r.text or "") for k in ("epg", "EPG", "schedule", "startDate"))
              print(f"\n   {r.status_code} {path}  epg-ish={has_epg}")
              print(f"      {body}")

          print("\n" + "=" * 86)
          print("C) does the country matter — ask as SA explicitly")
          print("=" * 86)
          for c in ("SA", "AE", "JO", "USA"):
              r = get("/product/id", {"id": str(probe_id), "productType": "LIVESTREAM",
                                      "productSubType": "LIVE_CHANNEL"}, country=c)
              if r is None or r.status_code != 200: 
                  print(f"   country={c}: {r.status_code if r else 'ERR'}"); continue
              d = r.json()
              pm = d.get("productModel") or {}
              print(f"   country={c}: reported={d.get('country')}  title={pm.get('title')!r}")

          print("\n" + "=" * 86)
          print("D) the web app's own data blob")
          print("=" * 86)
          r = requests.get("https://shahid.mbc.net/ar/livestreams", headers=H, timeout=30)
          b = r.text or ""
          m = re.search(r'<script id="__NEXT_DATA__"[^>]*>(.*?)</script>', b, re.S)
          print(f"   __NEXT_DATA__ present: {bool(m)}")
          if m:
              try:
                  d = json.loads(m.group(1))
                  s = json.dumps(d, ensure_ascii=False)
                  print(f"   blob {len(s)}B")
                  titles = sorted(set(re.findall(r'"title"\s*:\s*"(MBC[^"]{0,25})"', s)))
                  print(f"   MBC titles: {titles[:25]}")
                  ids = sorted(set(re.findall(r'"productType"\s*:\s*"([A-Z_]+)"', s)))
                  print(f"   productTypes: {ids}")
              except Exception as e:
                  print("   parse:", e)
          else:
              titles = sorted(set(re.findall(r'"title"\s*:\s*"(MBC[^"]{0,25})"', b)))
              print(f"   MBC titles in raw html: {titles[:25]}")
          PY
