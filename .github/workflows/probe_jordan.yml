name: Probe Jordan TV listings

on:
  workflow_dispatch:
  push:
    branches:
      - claude/arabic-channels-epg-99099k
    paths:
      - ".github/workflows/probe_jordan.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - name: Probe
        run: |
          python -u - <<'PY'
          import re
          import requests

          H = {"User-Agent": ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                              "(KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"),
               "Accept-Language": "ar,en;q=0.8"}
          TIME_RE = re.compile(r'\b([01]?\d|2[0-3]):[0-5]\d\b')

          for u in ["https://en.satexpat.com/tv/jordan/",
                    "https://share.google/BHQCvrUFc9CTOAXlC"]:
              try:
                  r = requests.get(u, headers=H, timeout=30, allow_redirects=True)
              except Exception as e:
                  print(f"ERR {str(e)[:60]}  {u}"); continue
              b = r.text
              print("\n" + "=" * 70)
              print(f"{u}\n   -> {r.url}")
              print(f"   HTTP {r.status_code}  {len(b)}B  HH:MM x{len(TIME_RE.findall(b))}")
              t = re.search(r'<title[^>]*>(.*?)</title>', b, re.S)
              print("   title:", re.sub(r'\s+', ' ', t.group(1))[:110] if t else "-")
              if r.status_code != 200:
                  continue
              # does it hold a schedule, or just channel/frequency rows?
              for word in ["epg", "schedule", "برنامج", "جدول", "frequency", "تردد",
                           "Programme", "Program"]:
                  n = b.lower().count(word.lower())
                  if n:
                      print(f"      {word!r}: x{n}")
              links = sorted(set(re.findall(r'href="(/tv/[a-z0-9\-/]+)"', b)))
              print(f"   internal /tv/ links ({len(links)}):")
              for l in links[:25]:
                  print("      ", l)
              names = sorted(set(re.findall(r'>\s*([A-Z][A-Za-z0-9 ]{3,28}(?:TV|Tv))\s*<', b)))
              print("   channel-looking names:", names[:20])
          PY
