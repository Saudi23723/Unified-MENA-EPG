name: Verify the Jordan guide carries the whole Roya network
on:
  push:
    branches: [claude/arabic-channels-epg-99099k]
    paths: ['.github/workflows/probe_jordan.yml', 'roya_jordan_epg.py']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q -r requirements.txt
      - name: Build
        run: python roya_jordan_epg.py
      - name: Check
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from collections import Counter
          root = ET.parse("roya_jordan_epg.xml").getroot()
          chans = root.findall("channel")
          counts = Counter(p.get("channel") for p in root.findall("programme"))
          print(f"channels: {len(chans)}   programmes: {sum(counts.values())}\n")
          for c in chans:
              n = [d.text for d in c.findall("display-name")]
              ic = [i.get("src") for i in c.findall("icon")]
              print(f"   {c.get('id'):<18} {(n[0] or ''):<26} {counts[c.get('id')]:>5}  "
                    f"{'own logo' if ic and 'raw.githubusercontent' not in ic[0] else 'repo logo' if ic else 'NO ICON'}")
          names = " ".join((d.text or "") for c in chans for d in c.findall("display-name"))
          for want in ("Documentaries", "مجتمعي", "حول العالم", "أنا بحكيلك القصة",
                       "قناة العربي 2", "AlJadeed", "AlJazeera"):
              print(f"   {want:<22} {'PRESENT' if want in names or want in ' '.join(c.get('id') for c in chans) else 'MISSING'}")
          assert len(chans) >= 25, f"only {len(chans)} channels"
          assert all(c.findall("icon") for c in chans), "a channel has no icon"
          days = sorted({p.get("start")[:8] for p in root.findall("programme")})
          print(f"\n   days covered: {days}")
          assert len(days) >= 5, f"only {len(days)} days"
          print("\nall checks passed")
          PY
      - name: Merge and health check
        run: |
          python merge_epg.py | tail -2
          python health_check.py || true
