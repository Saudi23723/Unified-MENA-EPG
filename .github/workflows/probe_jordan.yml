name: Read Shahid's own error messages
on:
  push:
    branches: [claude/arabic-channels-epg-99099k]
    paths: ['.github/workflows/probe_jordan.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q requests
      - name: Probe
        run: |
          python -u - <<'PY'
          import json
          import requests
          H = {"User-Agent": ("Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 "
                              "(KHTML, like Gecko) Chrome/126.0 Safari/537.36"),
               "Accept": "application/json", "Origin": "https://shahid.mbc.net",
               "Referer": "https://shahid.mbc.net/"}
          API = "https://api2.shahid.net/proxy/v2"

          def hit(tag, path, **params):
              try:
                  r = requests.get(API + path, headers=H, params=params, timeout=25)
                  body = (r.text or "")[:400]
                  print(f"\n   {r.status_code}  {tag}")
                  print(f"      {r.url[:150]}")
                  print(f"      {body}")
                  return r
              except Exception as e:
                  print(f"\n   ERR {type(e).__name__}: {str(e)[:70]}  {tag}")
                  return None

          print("=" * 86)
          print("A) what exactly is Shahid complaining about")
          print("=" * 86)
          hit("product/channel bare", "/product/channel")
          hit("page/channels bare", "/page/channels")
          hit("livestream bare", "/livestream")

          print("\n" + "=" * 86)
          print("B) the request={json} shape Shahid's own player uses")
          print("=" * 86)
          for tag, path, req in [
              ("product/id LIVESTREAM", "/product/id",
               {"id": "1", "productType": "LIVESTREAM", "productSubType": "LIVE_CHANNEL"}),
              ("page/channels", "/page/channels", {"pageNumber": 0, "pageSize": 50}),
              ("product/channels", "/product/channels", {"pageNumber": 0, "pageSize": 50}),
              ("livestream list", "/livestream",
               {"pageNumber": 0, "pageSize": 50, "productType": "LIVESTREAM"}),
              ("editorial channels", "/editorial",
               {"pageNumber": 0, "pageSize": 50, "pageType": "LIVE"}),
          ]:
              hit(tag, path, request=json.dumps(req), country="SA", language="ar")

          print("\n" + "=" * 86)
          print("C) the shahid.mbc.net page itself — what API does it call")
          print("=" * 86)
          for u in ("https://shahid.mbc.net/ar/livestreams",
                    "https://shahid.mbc.net/ar/live",
                    "https://shahid.mbc.net/en/livestreams"):
              try:
                  r = requests.get(u, headers=H, timeout=30, allow_redirects=True)
                  b = r.text or ""
                  print(f"\n   {r.status_code} {len(b):>8}B  {r.url[:90]}")
                  import re
                  apis = sorted(set(re.findall(r'https://api2?\.shahid\.net[^"\'\\\s]{0,90}', b)))
                  for a in apis[:12]:
                      print(f"      {a}")
                  ids = sorted(set(re.findall(r'"productType"\s*:\s*"([A-Z_]+)"', b)))
                  if ids: print(f"      productTypes seen: {ids}")
                  names = sorted(set(re.findall(r'"title"\s*:\s*"(MBC[^"]{0,20})"', b)))
                  if names: print(f"      MBC titles seen: {names[:15]}")
              except Exception as e:
                  print(f"   ERR {type(e).__name__}: {str(e)[:60]}  {u}")
          PY
