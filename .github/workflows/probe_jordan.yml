name: Alkass day=next
on:
  push:
    branches: [claude/arabic-channels-epg-99099k]
    paths: ['.github/workflows/probe_jordan.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q requests
      - name: Probe
        run: |
          python -u - <<'PY'
          import re, hashlib
          from datetime import datetime, timedelta, timezone
          import requests
          DOHA = timezone(timedelta(hours=3))
          H = {"User-Agent": ("Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 "
                              "(KHTML, like Gecko) Chrome/126.0 Safari/537.36")}
          BASE = "https://www.alkass.net/tvguide"

          def rows(body):
              # title + explicit HH:MM - HH:MM range, the shape the guide reads
              return re.findall(r"<div class='programs'[^>]*>(.*?)</div>", body, re.S)
          def times(body):
              return re.findall(r"(\d{1,2}:\d{2})\s*-\s*(\d{1,2}:\d{2})", body)
          def titles(body):
              return [re.sub(r"<[^>]+>", " ", t).strip()[:40]
                      for t in re.findall(r"<div class='programs'[^>]*>(.*?)</div>", body, re.S)]

          print("=" * 82)
          print("Does ?day=next really give a different day, and can it chain?")
          print("=" * 82)
          seen = {}
          for tag, url in [("today", BASE), ("day=next", BASE + "?day=next"),
                           ("day=next&day=next", BASE + "?day=next&day=next"),
                           ("day=prev", BASE + "?day=prev"),
                           ("day=next2", BASE + "?day=next2")]:
              r = requests.get(url, headers=H, timeout=30)
              t = times(r.text)
              h = hashlib.md5(repr(t).encode()).hexdigest()[:10]
              seen.setdefault(h, []).append(tag)
              print(f"   {tag:<20} {r.status_code} {len(r.text):>7}B  slots={len(t):<4} sig={h}")
          print(f"\n   distinct schedules: {len(seen)}")
          for h, who in seen.items(): print(f"      {h}: {who}")

          a = requests.get(BASE, headers=H, timeout=30).text
          b = requests.get(BASE + "?day=next", headers=H, timeout=30).text
          ta, tb = titles(a), titles(b)
          print(f"\n   today rows={len(ta)}   next rows={len(tb)}")
          print(f"   first 5 today: {ta[:5]}")
          print(f"   first 5 next : {tb[:5]}")
          same = sum(1 for x, y in zip(ta, tb) if x == y)
          print(f"   identical in the same position: {same}/{min(len(ta),len(tb))}")

          # does the page say which date it is showing?
          for tag, body in (("today", a), ("next", b)):
              d = re.findall(r"(\d{1,2}\s+\w+\s+20\d\d|\d{4}-\d{2}-\d{2}|"
                             r"(?:Mon|Tue|Wed|Thu|Fri|Sat|Sun)\w*,?\s+\d{1,2})", body)[:4]
              print(f"   dates printed on the {tag} page: {d}")
          PY
