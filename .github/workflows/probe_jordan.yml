name: Fajer source trace + Alkass parser
on:
  push:
    branches: [claude/arabic-channels-epg-99099k]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-ara
          pip install -q requests beautifulsoup4 pillow pytesseract lxml
      - name: Alkass parser day check
        run: |
          python -u - <<'PY'
          import requests, alkass_epg as A
          H = {"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 "
                             "(KHTML, like Gecko) Chrome/126.0 Safari/537.36"}
          p = {t: A.parse_page(requests.get(u, headers=H, timeout=30).text)
               for t, u in (("today", A.BASE), ("next", A.BASE + "?day=next"))}
          for t, v in p.items():
              print(f"   {t:<6} channels={len(v)} rows={sum(len(x) for x in v.values())}")
          print(f"   parse_page(today) == parse_page(next): {p['today'] == p['next']}")
          PY
      - name: Fajer source trace
        run: |
          python -u - <<'PY'
          import update_fajer_sports_epg as F
          from datetime import timezone, timedelta
          MECCA = timezone(timedelta(hours=3))

          print("=" * 80)
          print("Where does each Fajer match come from?")
          print("=" * 80)
          evs = F.collect()
          print(f"\n   {len(evs)} events\n")
          for e in sorted(evs, key=lambda x: str(x.get("start"))):
              start = e.get("start")
              local = start.astimezone(MECCA) if hasattr(start, "astimezone") else start
              print(f"   {local} | {e.get('channel_name')} | {e.get('title')}")
              for k, v in sorted(e.items()):
                  if k in ("start", "stop", "title", "channel_name"): continue
                  print(f"        {k} = {str(v)[:120]}")
              print()
          PY
