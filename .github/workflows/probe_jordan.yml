name: Verify Jordan Sports EPG (branch only)
on:
  push:
    branches: [claude/arabic-channels-epg-99099k]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -u JORDAN_SPORTS_FINAL_VERIFIED.py 2>&1 | tail -30
      - run: python -u roya_jordan_epg.py 2>&1 | tail -4
      - name: Inspect both Jordan guides
        run: |
          python -u - <<'PY'
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone
          now = datetime.now(timezone.utc)
          BADGES = "\U0001F535\U0001F7E2\U0001F7E3"
          for path in ("jordan_sports_epg.xml", "roya_jordan_epg.xml"):
              root = ET.parse(path).getroot()
              progs = root.findall("programme")
              badged = [p for p in progs
                        if any(b in (p.find("title").text or "") for b in BADGES)]
              future = [p for p in progs
                        if datetime.strptime(p.get("start"), "%Y%m%d%H%M%S %z") > now]
              print(f"\n### {path}: {len(root.findall('channel'))} channels, "
                    f"{len(progs)} programmes, {len(future)} ahead, "
                    f"{len(badged)} badged live")
              for p in badged:
                  s = datetime.strptime(p.get("start"), "%Y%m%d%H%M%S %z")
                  print(f"   {s:%Y-%m-%d %H:%M} UTC  {p.find('title').text}")
          PY
