name: Anchor Al Jadeed by its own on-air marker
on:
  push:
    branches: [claude/arabic-channels-epg-99099k]
    paths: ['.github/workflows/probe_jordan.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q requests beautifulsoup4
      - name: Probe
        run: |
          python -u - <<'PY'
          import re
          from datetime import datetime, timezone, timedelta
          import requests
          from bs4 import BeautifulSoup

          UTC = timezone.utc
          H = {"User-Agent": ("Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 "
                              "(KHTML, like Gecko) Chrome/126.0 Safari/537.36"),
               "Accept-Language": "ar,en;q=0.8"}
          def get(u, **kw):
              return requests.get(u, headers=H, timeout=25, **kw)

          now = datetime.now(UTC)
          print("now UTC     ", now.strftime("%Y-%m-%d %H:%M"))
          for name, off in (("Beirut +3", 3), ("Cairo  +3", 3), ("UTC+2   ", 2), ("Amman +3", 3)):
              print(f"   {name}: {now.astimezone(timezone(timedelta(hours=off))):%H:%M}")

          r = get("https://www.aljadeed.tv/schedule")
          b = r.text
          print(f"\nHTTP {r.status_code}  {len(b)}B")

          soup = BeautifulSoup(b, "html.parser")

          print("\n" + "=" * 78)
          print("A) every row as the page renders it")
          print("=" * 78)
          # rows are cards: a 'المدة: N دقيقة' div, then a time div, then the title anchor
          rows = []
          for m in re.finditer(r'المدة:\s*(\d+)\s*دقيقة(.{0,3000}?)</a>', b, re.S):
              seg = m.group(0)
              dur = int(m.group(1))
              tm = re.search(r'>\s*(\d{1,2}:\d{2})\s*<', seg)
              ttl = re.findall(r'<a [^>]*>\s*([^<>]{2,90}?)\s*</a>', seg)
              flags = [w for w in ("يعرض الان", "يعرض الآن", "مباشر", "الآن", "الان")
                       if w in seg]
              if tm:
                  rows.append((tm.group(1), dur, (ttl[-1] if ttl else "?"), flags))
          print(f"   parsed rows: {len(rows)}")
          for t, d, ttl, f in rows:
              print(f"   {t}  {d:>3}min  {ttl[:44]:44s} {' '.join(f)}")

          print("\n" + "=" * 78)
          print("B) where does the page put its 'now' marker")
          print("=" * 78)
          for w in ("يعرض الان", "يعرض الآن", "now", "current", "active", "live"):
              n = b.count(w)
              if n: print(f"   {w!r}: x{n}")
          for m in re.finditer(r'يعرض ال[آا]ن', b):
              print("   context:", re.sub(r"\s+", " ", b[max(0, m.start()-500):m.start()+260])[-620:])
              print()

          print("\n" + "=" * 78)
          print("C) day navigation — can we reach tomorrow")
          print("=" * 78)
          links = sorted({a.get("href") for a in soup.find_all("a", href=True)
                          if "schedule" in (a.get("href") or "")})
          for h in links[:25]:
              print("   ", h)
          for q in ("?date=2026-08-27", "/2026-08-27", "?day=1"):
              try:
                  rr = get("https://www.aljadeed.tv/schedule" + q)
                  ttl = re.search(r"<title>(.*?)</title>", rr.text, re.S)
                  print(f"   {q!r}: HTTP {rr.status_code} {len(rr.text)}B  "
                        f"title={re.sub(r'\\s+', ' ', ttl.group(1)).strip() if ttl else '?'}")
              except Exception as e:
                  print(f"   {q!r}: {e}")
          PY
