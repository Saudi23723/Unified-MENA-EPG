name: Does Al Jazeera schedule its sibling channels
on:
  push:
    branches: [claude/arabic-channels-epg-99099k]
    paths: ['.github/workflows/probe_jordan.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q requests
      - name: Probe
        run: |
          python -u - <<'PY'
          import re, hashlib
          import requests
          H = {"User-Agent": ("Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 "
                              "(KHTML, like Gecko) Chrome/126.0 Safari/537.36"),
               "Accept-Language": "ar,en;q=0.9"}
          ROW = re.compile(
              r'class="schedule__row__timeslot">\s*(\d{1,2}:\d{2})\s*</div>'
              r'(?:(?!schedule__row__timeslot).){0,400}?'
              r'class="schedule__row__showname">(.*?)</div>', re.S)
          def clean(s): return re.sub(r"\s+"," ",re.sub(r"<[^>]+>"," ",s)).strip()

          print("=" * 86)
          print("A) does ?channel= actually change what aljazeera.net/schedule returns")
          print("=" * 86)
          seen = {}
          for ch in ("", "mubasher", "documentary", "aja", "ajm", "ajd", "aljazeera",
                     "arabic", "english", "balkans", "mubasher-misr", "sport", "nonsense-xyz"):
              url = "https://www.aljazeera.net/schedule" + (f"?channel={ch}" if ch else "")
              try:
                  r = requests.get(url, headers=H, timeout=25)
              except Exception as e:
                  print(f"   {ch or '(none)':16s} ERR {e}"); continue
              rows = [(t, clean(n)) for t, n in ROW.findall(r.text)]
              sig = hashlib.md5(repr(rows).encode()).hexdigest()[:10]
              seen.setdefault(sig, []).append(ch or "(none)")
              print(f"   {ch or '(none)':16s} {r.status_code} rows={len(rows):<3} sig={sig} "
                    f"مكة={'بتوقيت مكة' in r.text}  first={rows[0] if rows else '-'}")
          print("\n   distinct schedules found:")
          for sig, who in seen.items():
              print(f"      {sig}: {who}")
          if len(seen) == 1:
              print("\n   -> the parameter is ignored: one schedule, the main channel only")
          else:
              print("\n   -> the parameter really selects a channel")

          print("\n" + "=" * 86)
          print("B) the channels the schedule page itself offers")
          print("=" * 86)
          b = requests.get("https://www.aljazeera.net/schedule", headers=H, timeout=25).text
          for pat in (r'channel["\']?\s*[:=]\s*["\']([a-z0-9\-]{3,20})["\']',
                      r'href="[^"]*schedule[^"]*channel=([a-z0-9\-]+)"',
                      r'data-channel="([^"]+)"'):
              found = sorted(set(re.findall(pat, b)))
              if found: print(f"   {pat[:40]}... -> {found[:20]}")

          print("\n" + "=" * 86)
          print("C) the ones the sweep did not get to")
          print("=" * 86)
          TZ = ("بتوقيت", "توقيت مكة", "توقيت بيروت", "غرينتش", "GMT", "UTC")
          T = re.compile(r"\b([01]?\d|2[0-3]):[0-5]\d\b")
          for name, urls in {
            "Al Mayadeen": ["https://www.almayadeen.net/programsschedule",
                            "https://www.almayadeen.net/schedule",
                            "https://www.almayadeen.net/shows",
                            "https://www.almayadeen.net/sitemap.xml"],
            "Sky News Arabia": ["https://www.skynewsarabia.com/tv-schedule",
                                "https://www.skynewsarabia.com/programs",
                                "https://www.skynewsarabia.com/sitemap.xml"],
            "Asharq News": ["https://asharq.com/schedule", "https://asharq.com/programs",
                            "https://www.asharqbusiness.com/programs"],
            "Al Ghad": ["https://alghad.tv/schedule", "https://alghad.tv/programs"],
            "Tele Liban": ["https://teleliban.com.lb/schedule", "https://teleliban.com.lb/grid"],
          }.items():
              print(f"\n   {name}")
              for u in urls:
                  try:
                      r = requests.get(u, headers=H, timeout=20)
                      body = r.text or ""
                      tz = [w for w in TZ if w in body]
                      print(f"      {r.status_code} {len(body):>7}B times={len(T.findall(body)):<4} "
                            f"tz={tz if tz else '-'}  {u}")
                      if u.endswith("sitemap.xml") and r.status_code == 200:
                          locs = re.findall(r"<loc>(.*?)</loc>", body)
                          hits = [l for l in locs if re.search(r"sched|program|grid|برنامج", l, re.I)]
                          print(f"         sitemap: {len(locs)} urls, schedule-ish: {hits[:5] or 'none'}")
                  except Exception as e:
                      print(f"      ERR {type(e).__name__}  {u}")
          PY
