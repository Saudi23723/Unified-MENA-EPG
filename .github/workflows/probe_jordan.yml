name: Probe the Jordan channel list

on:
  workflow_dispatch:
  push:
    branches:
      - claude/arabic-channels-epg-99099k
    paths:
      - ".github/workflows/probe_jordan.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - name: Probe
        run: |
          python -u - <<'PY'
          import re
          import requests

          H = {"User-Agent": ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                              "(KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"),
               "Accept-Language": "ar,en;q=0.8"}

          u = "https://share.google/BHQCvrUFc9CTOAXlC"
          try:
              r = requests.get(u, headers=H, timeout=30, allow_redirects=True)
          except Exception as e:
              print("ERR", e); raise SystemExit

          print("final url:", r.url)
          print("HTTP", r.status_code, len(r.text), "bytes")
          b = r.text

          title = re.search(r'<title[^>]*>(.*?)</title>', b, re.S)
          print("title:", re.sub(r'\s+', ' ', title.group(1))[:120] if title else "-")

          # every outbound link that looks like a broadcaster site
          links = sorted(set(re.findall(r'https?://([a-z0-9\.\-]+\.(?:jo|tv|com|net))(?:/|"|\b)', b)))
          jo = [l for l in links if not re.search(
              r'wikipedia|wikimedia|google|facebook|twitter|youtube|instagram|archive|creativecommons|mediawiki|wmflabs|wikidata', l)]
          print(f"\noutbound hosts ({len(jo)}):")
          for h in jo[:60]:
              print("   ", h)

          # channel names in Arabic near a link
          names = sorted(set(re.findall(r'>([؀-ۿ][؀-ۿ\s\d]{2,30})<', b)))
          print(f"\nArabic strings on the page ({len(names)}), first 60:")
          for n in names[:60]:
              print("   ", n.strip())
          PY
