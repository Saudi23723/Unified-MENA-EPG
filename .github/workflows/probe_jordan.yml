name: Probe Jordan Sports sources
on:
  push:
    branches: [claude/arabic-channels-epg-99099k]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python -u probe_jordan.py
