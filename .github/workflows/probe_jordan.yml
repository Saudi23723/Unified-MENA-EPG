name: Probe Al Araby real domains

on:
  workflow_dispatch:
  push:
    branches:
      - claude/arabic-channels-epg-99099k
    paths:
      - ".github/workflows/probe_jordan.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - name: Probe
        run: |
          python -u - <<'PY'
          import re
          import requests
          from concurrent.futures import ThreadPoolExecutor

          H = {"User-Agent": ("Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 "
                              "(KHTML, like Gecko) Chrome/126.0 Safari/537.36"),
               "Accept-Language": "ar,en;q=0.8"}
          TIME = re.compile(r'\b([01]?\d|2[0-3]):[0-5]\d\b')

          SLUGS = ["", "/schedule", "/tv-schedule", "/programs-schedule",
                   "/program-schedule", "/epg", "/grid", "/live", "/programs",
                   "/%D8%AC%D8%AF%D9%88%D9%84-%D8%A7%D9%84%D8%A8%D8%B1%D8%A7%D9%85%D8%AC",
                   "/%D8%AE%D8%B1%D9%8A%D8%B7%D8%A9-%D8%A7%D9%84%D8%A8%D8%B1%D8%A7%D9%85%D8%AC",
                   "/sitemap.xml"]
          HOSTS = ["https://www.alaraby.com", "https://www.alaraby2.com"]

          def check(item):
              host, slug = item
              u = host + slug
              try:
                  r = requests.get(u, headers=H, timeout=20)
              except Exception as e:
                  return u, None, 0, 0, str(e)[:40]
              return u, r.status_code, len(r.text), len(TIME.findall(r.text)), ""

          jobs = [(h, s) for h in HOSTS for s in SLUGS]
          with ThreadPoolExecutor(max_workers=8) as pool:
              rows = list(pool.map(check, jobs))
          host = None
          winners = []
          for u, c, size, times, err in rows:
              h = u.split("/")[2]
              if h != host:
                  print(f"\n--- {h} ---"); host = h
              flag = ""
              if c == 200 and times >= 10:
                  flag = "  <== TIMES"; winners.append(u)
              print(f"   HTTP {str(c):<5} {size:>8}B  HH:MM x{times:<4}{flag}  {u}  {err}")

          print()
          print("=" * 74)
          for u in winners:
              b = requests.get(u, headers=H, timeout=25).text
              print(f"\n### {u}")
              seen = 0
              for m in TIME.finditer(b):
                  a, bb = max(0, m.start()-180), m.end()+120
                  txt = re.sub(r"\s+", " ", re.sub(r"<[^>]+>", " ", b[a:bb])).strip()
                  if len(txt) < 25 or "datePublished" in txt or "dateModified" in txt:
                      continue
                  print("   ...", txt[:200]); seen += 1
                  if seen >= 6: break
              for w in ["بتوقيت", "توقيت", "غرينتش", "مكة", "الدوحة", "لندن"]:
                  n = b.count(w)
                  if n: print(f"   timezone word {w!r}: x{n}")
          if not winners:
              print("no page on either domain carries a schedule")

          # the sitemap may name a schedule page outright
          for h in HOSTS:
              try:
                  b = requests.get(h + "/sitemap.xml", headers=H, timeout=20).text
              except Exception:
                  continue
              hits = sorted(set(re.findall(r'<loc>([^<]*(?:schedule|جدول|epg|grid|%D8%AC%D8%AF)[^<]*)</loc>', b, re.I)))
              print(f"\n   {h}/sitemap.xml schedule-ish entries: {hits[:10] or 'none'}")
          PY
