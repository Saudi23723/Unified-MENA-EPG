name: Alkass parser day check
on:
  push:
    branches: [claude/arabic-channels-epg-99099k]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q requests
      - name: Probe
        run: |
          python -u - <<'PY'
          import difflib, requests
          from datetime import datetime, timedelta, timezone
          import alkass_epg as A

          DOHA = timezone(timedelta(hours=3))
          H = {"User-Agent": ("Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 "
                             "(KHTML, like Gecko) Chrome/126.0 Safari/537.36")}

          pages = {}
          for tag, url in (("today", A.BASE), ("next", A.BASE + "?day=next")):
              pages[tag] = requests.get(url, headers=H, timeout=30).text

          print("=" * 78)
          print("Does the real parser see two different days?")
          print("=" * 78)
          parsed = {t: A.parse_page(b) for t, b in pages.items()}
          for t, p in parsed.items():
              print(f"   {t:<6} channels={len(p)} rows={sum(len(v) for v in p.values())}")
          print(f"\n   parse_page(today) == parse_page(next): "
                f"{parsed['today'] == parsed['next']}")
          for n in sorted(set(parsed['today']) | set(parsed['next'])):
              a, b = parsed['today'].get(n, []), parsed['next'].get(n, [])
              same = sum(1 for x, y in zip(a, b) if x == y)
              print(f"      Alkass {n}: today={len(a):<3} next={len(b):<3} "
                    f"identical rows={same}")

          print("\n   what the 36 raw bytes actually are:")
          for line in difflib.unified_diff(
                  pages['today'].splitlines(), pages['next'].splitlines(),
                  'today', 'next', n=0, lineterm=''):
              if line.startswith(('+++', '---', '@@')): continue
              print(f"      {line[:200]}")

          now = datetime.now(DOHA)
          rows = [r for v in parsed['today'].values() for r in v]
          print(f"\n   Doha now {now:%Y-%m-%d %H:%M} | rows today={len(rows)}")
          PY
