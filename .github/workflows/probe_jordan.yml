name: Verify elcinema anchor and Al Jadeed clock
on:
  push:
    branches: [claude/arabic-channels-epg-99099k]
    paths: ['.github/workflows/probe_jordan.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q requests beautifulsoup4
      - name: Probe
        run: |
          python -u - <<'PY'
          import re
          from datetime import datetime, timezone, timedelta
          import requests
          from bs4 import BeautifulSoup

          UTC = timezone.utc
          AMMAN = timezone(timedelta(hours=3))
          H = {"User-Agent": ("Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 "
                              "(KHTML, like Gecko) Chrome/126.0 Safari/537.36"),
               "Accept-Language": "ar,en;q=0.8"}
          def get(u, **kw):
              return requests.get(u, headers=H, timeout=25, **kw)

          AMPM = {"صباحًا": 0, "صباحاً": 0, "صباحا": 0,
                  "مساءً": 12, "مساءاً": 12, "مساء": 12, "مساءا": 12}

          def norm(s):
              s = re.sub(r"^\s*(?:برنامج|مسلسل|فيلم|نشرة)\s*[-–]?\s*", "", (s or "").strip())
              s = re.sub(r"[^ء-يa-zA-Z0-9]+", " ", s)
              return re.sub(r"\s+", " ", s).strip().lower()

          def hhmm(m):
              return f"{m//60:02d}:{m%60:02d}"

          def elcinema(cid):
              soup = BeautifulSoup(get(f"https://elcinema.com/tvguide/{cid}/").text, "html.parser")
              out = []
              for ul in soup.select("ul.unstyled"):
                  lis = ul.find_all("li")
                  if len(lis) < 2: continue
                  title = re.sub(r"\s+", " ", lis[0].get_text(" ", strip=True)).strip()
                  meta = re.sub(r"\s+", " ", lis[1].get_text(" ", strip=True)).strip()
                  m = re.search(r'(\d{1,2}):(\d{2})\s*(\S+)', meta)
                  if not m: continue
                  h, mi, ap = int(m.group(1)), int(m.group(2)), m.group(3).strip()
                  add = AMPM.get(ap)
                  if add is None: continue
                  if add == 12 and h != 12: h += 12
                  if add == 0 and h == 12: h = 0
                  out.append((norm(title), h * 60 + mi, title, meta))
              return out

          print("=" * 78)
          print("A) elcinema رؤيا 1299 — every row as published")
          print("=" * 78)
          el = elcinema("1299")
          for t, m, raw, meta in el:
              print(f"   {hhmm(m)}  {raw[:44]:44s} | {meta[:40]}")

          print()
          print("=" * 78)
          print("B) Roya API — every row, UTC and Amman(+3)")
          print("=" * 78)
          roya = []
          for day in (0, -1, 1):
              try:
                  d = get("https://backend.roya.tv/api/v01/channels/schedule-pagination",
                          params={"day_number": day}).json()
              except Exception as e:
                  print("   roya day", day, e); continue
              for blk in d.get("data") or []:
                  for ch in blk.get("channel") or []:
                      if (ch.get("title") or "").strip() != "Roya TV": continue
                      for p in ch.get("programs") or []:
                          ts = p.get("start_timestamp")
                          if ts is None: continue
                          st = datetime.fromtimestamp(int(ts), tz=UTC)
                          roya.append((norm(p.get("name")), st.hour * 60 + st.minute,
                                       p.get("name"), st))
          roya.sort(key=lambda r: r[3])
          for t, m, raw, st in roya:
              print(f"   UTC {st:%m-%d %H:%M}  Amman {st.astimezone(AMMAN):%H:%M}  {raw[:40]}")

          print()
          print("=" * 78)
          print("C) the matched pairs at each candidate offset")
          print("=" * 78)
          shared = {t for t, _m, _r, _x in el} & {t for t, _m, _r, _x in roya}
          for off in (-180, 0, 180, 510):
              pairs = []
              for t, shown, raw, _meta in el:
                  if t not in shared: continue
                  want = (shown - off) % 1440
                  for t2, m2, raw2, st2 in roya:
                      if t2 == t and m2 == want:
                          pairs.append((raw, hhmm(shown), f"{st2:%m-%d %H:%M}Z",
                                        f"{st2.astimezone(AMMAN):%H:%M}"))
                          break
              print(f"\n   offset {off/60:+.1f}h -> {len(pairs)} pairs")
              for raw, s, z, a in pairs:
                  print(f"      elcinema {s}  ==  Roya {z} (Amman {a})   {raw[:34]}")

          print()
          print("=" * 78)
          print("D) Al Jadeed — context around 'توقيت' / 'بيروت'")
          print("=" * 78)
          b = get("https://www.aljadeed.tv/schedule").text
          for w in ("توقيت", "بيروت"):
              for m in re.finditer(w, b):
                  seg = re.sub(r"\s+", " ", b[max(0, m.start()-220):m.start()+220])
                  print(f"   [{w}] ...{seg}...")
                  print()
          PY
