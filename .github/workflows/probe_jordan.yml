name: Probe OSN schedule

on:
  workflow_dispatch:
  push:
    branches:
      - claude/arabic-channels-epg-99099k
    paths:
      - ".github/workflows/probe_jordan.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - name: Probe
        run: |
          python -u - <<'PY'
          import json, re
          import requests

          H = {"User-Agent": ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                              "(KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"),
               "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
               "Accept-Language": "ar,en;q=0.8",
               "Sec-Fetch-Dest": "document", "Sec-Fetch-Mode": "navigate",
               "Sec-Fetch-Site": "none", "Upgrade-Insecure-Requests": "1"}
          TIME_RE = re.compile(r'\b([01]?\d|2[0-3]):[0-5]\d\b')
          WANT = re.compile(r'جزيرة|عربية|العربي|مملكة|عمان|الأردن|سما|الجديد|'
                            r'jazeera|arabiya|araby|mamlaka|amman|jordan|jadeed|roya|sama', re.I)

          for u in ["https://www.osn.com/ar-eg/watch/tv-schedule",
                    "https://www.osn.com/en-eg/watch/tv-schedule",
                    "https://www.osn.com/ar-ae/watch/tv-schedule"]:
              try:
                  r = requests.get(u, headers=H, timeout=30)
              except Exception as e:
                  print(f"   ERR {str(e)[:60]}  {u}"); continue
              b = r.text
              print(f"\n   HTTP {r.status_code}  {len(b):>8}B  HH:MM x{len(TIME_RE.findall(b))}  {u}")
              if r.status_code != 200:
                  print("     ", re.sub(r'\s+', ' ', b)[:160]); continue
              print("      __NEXT_DATA__:", "yes" if "__NEXT_DATA__" in b else "no",
                    "| ld+json:", len(re.findall(r'application/ld\+json', b)))
              names = sorted(set(m.group(0) for m in WANT.finditer(b)))
              print("      channel names present:", names[:14])
              # any API the page calls
              apis = sorted(set(re.findall(r'https://[a-z0-9\.\-]*osn[a-z0-9\.\-]*/[a-zA-Z0-9\-_/]{4,60}', b)))
              for a in apis[:14]:
                  print("      url:", a)
              m = re.search(r'<script id="__NEXT_DATA__"[^>]*>(.*?)</script>', b, re.S)
              if m:
                  try:
                      d = json.loads(m.group(1))
                      blob = json.dumps(d, ensure_ascii=False)
                      print("      payload bytes:", len(blob))
                      print("      channel-ish keys:", sorted(set(re.findall(
                          r'"(channel[A-Za-z]*|programs?|schedule|epg|startTime|endTime|airDate)"', blob)))[:14])
                  except Exception as e:
                      print("      payload not JSON:", str(e)[:50])
          PY
