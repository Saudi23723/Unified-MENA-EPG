name: Probe Spor Ekranı for beIN

# Research only, and deliberately not on main. Runs on a runner because
# the Turkish hosts refuse requests from anywhere else. Read-only.
on:
  push:
    paths:
      - "tools/probe_sporekrani_bein.py"
      - ".github/workflows/probe_sporekrani_bein.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python tools/probe_sporekrani_bein.py
