name: Probe — Viaplay, V Sport, SPORT TV
on:
  push:
    paths:
      - "probes/probe_nordic_iberian.py"
      - ".github/workflows/probe_nordic_iberian.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -u probes/probe_nordic_iberian.py
