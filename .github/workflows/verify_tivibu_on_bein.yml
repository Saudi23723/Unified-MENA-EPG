name: Verify Tivibu on the beIN Türkiye guide
on:
  push:
    paths:
      - ".github/workflows/verify_tivibu_on_bein.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Build the beIN Türkiye guide
        run: python bein_sports_turkey_epg.py
      - name: Report what came out
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from collections import Counter
          root = ET.parse("bein_sports_turkey_epg.xml").getroot()
          chans = [c.get("id") for c in root.findall("channel")]
          counts = Counter(p.get("channel") for p in root.findall("programme"))
          tiv = [c for c in chans if c.startswith("Tivibu")]
          print("channels:", len(chans), "| tivibu channels:", tiv)
          print("duplicate channel ids:", [k for k,v in Counter(chans).items() if v>1])
          tags = [c.tag for c in root]
          print("all channels before all programmes:",
                tags == sorted(tags, key=lambda t: 0 if t=="channel" else 1))
          for c in chans:
              print(f"  {c:24} {counts.get(c,0):4}")
          days = sorted({p.get("start")[:8] for p in root.findall("programme")
                         if p.get("channel","").startswith("Tivibu")})
          print("tivibu days:", days)
          for p in root.findall("programme"):
              if p.get("channel","").startswith("Tivibu"):
                  print("   ", p.get("channel"), p.get("start"), p.findtext("title"))
          PY
