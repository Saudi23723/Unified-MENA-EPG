name: Official logos for channels without one

# Manual (owner, 25 Nov 2026): tools/official_logos.py takes each listed channel's logo from the broadcaster's
# own app (App Store) or its Wikipedia article and saves it in logos/ on main.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  logos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow >/dev/null
      - run: python3 tools/official_logos.py
      - name: Save
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logos/*.png
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -qm "Official logos for playlist channels without one"
          for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
