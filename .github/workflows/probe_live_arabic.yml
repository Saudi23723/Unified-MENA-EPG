# Two questions asked of the sources rather than guessed: which Sky
# programme is the LIVE one, and which Arabic newsrooms cover Turkey.
# It commits nothing and publishes nothing.
name: Probe live marking and Arabic sources

on:
  workflow_dispatch:
  push:
    branches: [claude/arabic-channels-epg-99099k]
    paths:
      - "probes/probe_live_and_arabic.py"
      - ".github/workflows/probe_live_arabic.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -u probes/probe_live_and_arabic.py
