# Ask RMC Sport where its schedule is and what is in a row.
# It commits nothing and publishes nothing.
name: Probe RMC Sport France

on:
  workflow_dispatch:
  push:
    branches: [claude/arabic-channels-epg-99099k]
    paths:
      - "probes/probe_rmc_sport.py"
      - ".github/workflows/probe_rmc_sport.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -u probes/probe_rmc_sport.py
