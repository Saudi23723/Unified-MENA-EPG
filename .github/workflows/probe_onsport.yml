name: Probe ON Sport for al-Ahly
on:
  push:
    paths:
      - "tools/probe_onsport_ahly.py"
      - ".github/workflows/probe_onsport.yml"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -u tools/probe_onsport_ahly.py
