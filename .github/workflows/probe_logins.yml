name: Probe which stored logins belong to which playlist (names only)

# One-off (29 Oct 2026): says which repository secret (XTREAM*, STRONG_URL, DREAM4K_URL) is on which playlist's
# server, by comparing host names only. Writes nothing secret; result on branch probe-logins.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Compare hosts
        env:
          XTREAM_URL: ${{ secrets.XTREAM_URL }}
          XTREAM_USER: ${{ secrets.XTREAM_USER }}
          XTREAM2_URL: ${{ secrets.XTREAM2_URL }}
          XTREAM2_USER: ${{ secrets.XTREAM2_USER }}
          XTREAM3_URL: ${{ secrets.XTREAM3_URL }}
          XTREAM3_USER: ${{ secrets.XTREAM3_USER }}
          STRONG_URL: ${{ secrets.STRONG_URL }}
          DREAM4K_URL: ${{ secrets.DREAM4K_URL }}
        run: |
          mkdir -p _out
          python3 - <<'PY' > _out/result.txt
          import os, urllib.parse
          hosts = {"argon": "saudi.ottb.xyz", "aroma": "ar44.site", "dream4k": "cdn-1.mip8k.com", "family4k": "familyvip.me",
                   "hydra": "blockchaincourses.net", "strong": "saudi237.xyz", "up1": "up1.live"}
          for k in ("XTREAM", "XTREAM2", "XTREAM3", "STRONG", "DREAM4K"):
              u = os.environ.get(k + "_URL", "").strip()
              if not u:
                  print(k, "empty"); continue
              h = (urllib.parse.urlsplit(u if "//" in u else "http://" + u).hostname or "").lower()
              who = [p for p, x in hosts.items() if h == x or h.endswith("." + x)]
              q = urllib.parse.parse_qs(urllib.parse.urlsplit(u if "//" in u else "http://" + u).query)
              has_login = bool(os.environ.get(k + "_USER")) or bool(q.get("username"))
              print(k, "->", who or ["unknown server"], "login:", "yes" if has_login else "no")
          PY
          cat _out/result.txt
          cd _out && git init -q -b probe-logins && git add -A && git -c user.name=bot -c user.email=bot@x commit -q -m probe \
            && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe-logins
