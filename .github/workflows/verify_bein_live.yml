name: Verify beIN live badge provenance

# Research only, and deliberately not on main. Read-only, commits
# nothing, deleted once the check passes.
on:
  push:
    paths:
      - "tools/verify_bein_live.py"
      - "bein_sports_turkey_epg.py"
      - ".github/workflows/verify_bein_live.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python tools/verify_bein_live.py
