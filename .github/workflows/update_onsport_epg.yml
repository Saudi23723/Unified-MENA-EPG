name: Update ON Sport EPG

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: DEBUG structural probe (temporary)
        run: python _debug_probe.py

      - name: Generate ON Sport EPG
        run: |
          python update_onsport_epg.py

      - name: Commit updated EPG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add onsport_epg.xml
          git diff --cached --quiet || git commit -m "Update ON Sport EPG"
          git push
