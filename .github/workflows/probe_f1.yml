name: Probe — F1 sources
on:
  push:
    paths:
      - "probes/probe_f1_sources.py"
      - "probes/probe_f1_radio.py"
      - "probes/probe_f1_dump.py"
      - "probes/probe_f1_full.py"
      - "probes/probe_f1_facts.py"
      - "f1_epg.py"
      - "f1_board.py"
      - ".github/workflows/probe_f1.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Install the fonts the board is drawn with
        run: tools/apt_install.sh fonts-freefont-ttf fonts-dejavu-core
      - name: What can be said about a circuit
        run: python -u probes/probe_f1_facts.py
      - name: Draw all three boards from nothing
        run: python -u f1_board.py
      - name: Build the F1 channel for real
        run: python -u f1_epg.py
      - name: What it produced
        run: |
          ls -la boards/f1_0.png f1_epg.xml f1_state.json
          python - <<'PY2'
          import xml.etree.ElementTree as ET
          from PIL import Image
          r = ET.parse("f1_epg.xml").getroot()
          print("channels :", len(r.findall("channel")))
          print("programmes:", len(r.findall("programme")))
          p = r.find("programme")
          print("title    :", p.findtext("title"))
          print("--- the page ---")
          print(p.findtext("desc"))
          im = Image.open("boards/f1_0.png")
          print("board    :", im.size, im.mode)
          PY2
      - uses: actions/upload-artifact@v4
        with:
          name: f1-board
          path: boards/f1_0.png
