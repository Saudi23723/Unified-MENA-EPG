name: Probe — F1 sources
on:
  push:
    paths:
      - "probes/probe_f1_sources.py"
      - "probes/probe_f1_radio.py"
      - "probes/probe_f1_dump.py"
      - "probes/probe_f1_full.py"
      - ".github/workflows/probe_f1.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -u probes/probe_f1_full.py
