name: Channel 6 — Live Flight Tracker

on:
  schedule:
    - cron: "*/8 * * * *"
  workflow_dispatch:

concurrency:
  group: flight-tracker
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate generator
        run: python3 -c "import ast;ast.parse(open('tools/generate_flight_tracker.py').read());print('generator ok')"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --quiet pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core
      - name: Refresh live flights from keyless ADS-B feed
        continue-on-error: true
        timeout-minutes: 2
        run: python tools/fetch_flights.py --out stream/flights.json
      - name: Keep all five requested airlines
        run: python3 -c 'import json;d=json.load(open("stream/flights.json"));d["flights"]=[f for f in d["flights"] if f["code"] in ("EY","EK","RJ","FZ","TK")];json.dump(d,open("stream/flights.json","w"),indent=1);print("kept",len(d["flights"]))'
      - name: Render Jordan-time channel
        env:
          FLIGHT_DATA: stream/flights.json
          CH6_WORK: /tmp/ch6
          CH6_OUT: stream
        run: python tools/generate_flight_tracker.py --tz 3 --out flight_tracker
      - name: Render Dubai-time channel
        env:
          FLIGHT_DATA: stream/flights.json
          CH6_WORK: /tmp/ch6
          CH6_OUT: stream
        run: python tools/generate_flight_tracker.py --tz 4 --out dubai_flight_tracker
      - name: Commit updated stream
        run: |
          git config user.name "flight-tracker-bot"
          git config user.email "bot@users.noreply.github.com"
          PATHS="tools/generate_flight_tracker.py stream/flights.json stream/flight_tracker* stream/dubai_flight_tracker*"
          for i in 1 2 3 4 5 6; do
            git fetch origin main
            git reset --soft origin/main
            git add $PATHS
            if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
            git commit -m "chore: refresh channel 6 flight tracker"
            git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
