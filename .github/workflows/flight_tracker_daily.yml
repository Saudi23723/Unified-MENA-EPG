name: Channel 6 — Live Flight Tracker

on:
  schedule:
    - cron: "5 0 * * *"      # 00:05 UTC: pull the day's flights from AviationStack
    - cron: "*/8 * * * *"    # every 8 minutes: re-render with live status/progress
  workflow_dispatch:

concurrency:
  group: flight-tracker
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --quiet pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core

      # Only the 00:05 run spends API requests; the 8-minute runs reuse the cache.
      - name: Fetch today's flights
        if: github.event.schedule == '5 0 * * *' || github.event_name == 'workflow_dispatch'
        env:
          AVIATIONSTACK_API_KEY: ${{ secrets.AVIATIONSTACK_API_KEY }}
        run: python tools/fetch_flights.py --out stream/flights.json

      - name: Render Jordan-time channel
        env:
          FLIGHT_DATA: stream/flights.json
          CH6_WORK: /tmp/ch6
          CH6_OUT: stream
        run: python tools/generate_flight_tracker.py --tz 3 --out flight_tracker

      - name: Render Dubai-time channel
        env:
          FLIGHT_DATA: stream/flights.json
          CH6_WORK: /tmp/ch6
          CH6_OUT: stream
        run: python tools/generate_flight_tracker.py --tz 4 --out dubai_flight_tracker

      - name: Commit updated stream
        run: |
          git config user.name "flight-tracker-bot"
          git config user.email "bot@users.noreply.github.com"
          git add stream/flights.json stream/flight_tracker* stream/dubai_flight_tracker*
          git diff --cached --quiet || git commit -m "chore: refresh channel 6 flight tracker"
          git push
