name: Channel 6 — Live Flight Tracker

on:
  schedule:
    - cron: "5 0 * * *"      # 00:05 UTC: pull the day's flights from AviationStack
    - cron: "*/8 * * * *"    # every 8 minutes: re-render with live status/progress
  workflow_dispatch:

concurrency:
  group: flight-tracker
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Upgrade the generator in-repo: 18s pages, dynamic length covering ALL
      # flights, correct footer. Idempotent sed patches, committed back below.
      - name: Patch generator to latest version
        run: |
          sed -i 's/^DURATION = 60.*$/DURATION = None  # dynamic: pages * PAGE_SECONDS/' tools/generate_flight_tracker.py
          sed -i 's/^PAGE_SECONDS = .*/PAGE_SECONDS = 18/' tools/generate_flight_tracker.py
          sed -i 's/    pages = max(1, DURATION \/\/ PAGE_SECONDS)/    pages = max(1, math.ceil(len(flights) \/ PER_PAGE))/' tools/generate_flight_tracker.py
          sed -i 's/    return flights\[:pages \* PER_PAGE\], pages/    return flights, pages/' tools/generate_flight_tracker.py
          sed -i 's/    n = FPS \* DURATION/    n = FPS * build_flights(ROWS, 0)[1] * PAGE_SECONDS/' tools/generate_flight_tracker.py
          sed -i 's/refreshed every 20 min/refreshed every 8 min/' tools/generate_flight_tracker.py
          grep -n "PAGE_SECONDS = \|n = FPS\|pages = max" tools/generate_flight_tracker.py

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --quiet pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core

      # Only the 00:05 run spends API requests; the 8-minute runs reuse the cache.
      - name: Fetch today's flights
        continue-on-error: true   # fall back to cached stream/flights.json
        if: github.event.schedule == '5 0 * * *' || github.event_name == 'workflow_dispatch'
        env:
          AVIATIONSTACK_API_KEY: ${{ secrets.AVIATIONSTACK_API_KEY }}
        run: python tools/fetch_flights.py --out stream/flights.json

      - name: Render Jordan-time channel
        env:
          FLIGHT_DATA: stream/flights.json
          CH6_WORK: /tmp/ch6
          CH6_OUT: stream
        run: python tools/generate_flight_tracker.py --tz 3 --out flight_tracker

      - name: Render Dubai-time channel
        env:
          FLIGHT_DATA: stream/flights.json
          CH6_WORK: /tmp/ch6
          CH6_OUT: stream
        run: python tools/generate_flight_tracker.py --tz 4 --out dubai_flight_tracker

      - name: Commit updated stream
        run: |
          git config user.name "flight-tracker-bot"
          git config user.email "bot@users.noreply.github.com"
          git add tools/generate_flight_tracker.py stream/flights.json stream/flight_tracker* stream/dubai_flight_tracker*
          git diff --cached --quiet || git commit -m "chore: refresh channel 6 flight tracker"
          git push
