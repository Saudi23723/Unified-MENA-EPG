name: Audit beIN Türkiye times

# Research only, and deliberately not on main. Runs on a runner because
# the Turkish hosts refuse every request from anywhere else. Read-only:
# it fetches, compares and prints, and commits nothing.
on:
  push:
    paths:
      - "tools/audit_bein_tr_times.py"
      - ".github/workflows/audit_bein_tr.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python tools/audit_bein_tr_times.py
