name: Build Private Vault for Windows

# Builds the laptop program in PrivateVault/laptop/ into one Khazanti.exe,
# checks it end to end, and publishes it as a release.

on:
  push:
    paths:
      - 'PrivateVault/laptop/**'
      - 'PrivateVault/cloud/**'
      - '.github/workflows/build_private_vault_windows.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: private-vault-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: PrivateVault/laptop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: pip install -r requirements.txt

      - name: Test the server
        run: python khazanti_selftest.py

      - name: Build Khazanti.exe
        run: |
          python -c "import khazanti; khazanti.tray_icon_image().resize((256, 256)).save('icon.ico', sizes=[(256, 256), (64, 64), (32, 32), (16, 16)])"
          python -c "import json; json.dump({'build': ${{ github.run_number }}}, open('build_info.json', 'w'))"
          pyinstaller --onefile --noconsole --name Khazanti --icon icon.ico --add-data "index.html;." --add-data "build_info.json;." --hidden-import pystray._win32 khazanti.py

      - name: Test the built program
        env:
          EXPECT_BUILD: ${{ github.run_number }}
        run: python khazanti_selftest.py dist/Khazanti.exe

      # A real update: the new .exe updates itself to the build published
      # before it, swaps the file and starts again on its own.
      - name: Test a one-click update
        run: python khazanti_update_check.py dist/Khazanti.exe

      # Sending to the cloud: ffmpeg is fetched as the program does on first
      # use, then a 1080p video goes from one vault to another as 720p.
      - name: Fetch ffmpeg as the program does
        run: python khazanti_ffmpeg_check.py

      - name: Test sending to the cloud
        run: python khazanti_cloud_check.py dist/Khazanti.exe

      # The program updates itself from this branch (see UPDATE_SOURCES).
      - name: Publish for one-click updates
        shell: bash
        run: |
          dir="$RUNNER_TEMP/updates"
          mkdir -p "$dir" && cp dist/Khazanti.exe "$dir/"
          # The cloud server installs and updates itself from the same branch.
          cp khazanti.py index.html build_info.json ../cloud/install-cloud.sh "$dir/"
          echo "{\"build\": ${{ github.run_number }}, \"exe\": \"Khazanti.exe\"}" > "$dir/latest.json"
          cd "$dir"
          git init -q -b vault-builds-windows
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Khazanti build ${{ github.run_number }}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" HEAD:vault-builds-windows
          curl -sS "https://purge.jsdelivr.net/gh/${{ github.repository }}@vault-builds-windows/latest.json" > /dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: Khazanti-windows
          path: PrivateVault/laptop/dist/Khazanti.exe

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: private-vault-windows-${{ github.run_number }}
          name: خزنتي للابتوب - Windows (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          body: |
            حمّل Khazanti.exe وشغّله. إذا ظهر «Windows protected your PC» اضغط More info ثم Run anyway.
            عند السؤال عن جدار الحماية اختر السماح للشبكات الخاصة حتى يصل الهاتف إلى الخزنة.
          files: PrivateVault/laptop/dist/Khazanti.exe

  # The cloud install, on a fresh Ubuntu machine, from the files just published.
  cloud-install:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install as on a cloud server
        env:
          KHAZANTI_PASSWORD: test-pass-1234
        run: |
          sleep 60   # let the raw files of the new publish be served
          # A small model keeps the check quick; the real server gets qwen2.5:3b.
          sudo env KHAZANTI_PASSWORD="$KHAZANTI_PASSWORD" KHAZANTI_LOCAL_MODEL=qwen2.5:0.5b \
            bash PrivateVault/cloud/install-cloud.sh ci-check-khazanti not-a-real-token
      - name: The vault answers behind the proxy, with its password
        run: |
          curl -fsS http://127.0.0.1:47801/api/status
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST -H "Content-Type: application/json" \
            -d '{"password":"test-pass-1234"}' http://127.0.0.1:47801/api/login)
          test "$code" = 200
          systemctl is-active khazanti
          systemctl is-active caddy
          sudo /usr/local/bin/khazanti-update && echo "update script ran"
      - name: A Word file comes back as PDF
        run: |
          token=$(curl -fsS -X POST -H "Content-Type: application/json" -d '{"password":"test-pass-1234"}' \
            http://127.0.0.1:47801/api/login | python3 -c 'import json,sys;print(json.load(sys.stdin)["token"])')
          printf 'Four forces of flight\nLift, weight, thrust, drag\n' > notes.txt
          soffice --headless --convert-to docx notes.txt >/dev/null
          id=$(curl -fsS -X PUT -H "Authorization: Bearer $token" --data-binary @notes.docx \
            "http://127.0.0.1:47801/api/upload?name=notes.docx" | python3 -c 'import json,sys;print(json.load(sys.stdin)["id"])')
          curl -fsS -H "Authorization: Bearer $token" "http://127.0.0.1:47801/api/pdf/$id" -o out.pdf
          head -c 4 out.pdf | grep -q '%PDF' && echo "word to pdf works on the cloud server"
      - name: The study assistant answers from the server's own model
        run: |
          for i in $(seq 1 60); do ollama list | grep -q 'qwen2.5:0.5b' && break; sleep 5; done
          ollama list
          token=$(curl -fsS -X POST -H "Content-Type: application/json" -d '{"password":"test-pass-1234"}' \
            http://127.0.0.1:47801/api/login | python3 -c 'import json,sys;print(json.load(sys.stdin)["token"])')
          curl -fsS -H "Authorization: Bearer $token" http://127.0.0.1:47801/api/ai/status
          curl -fsS -m 600 -X POST -H "Authorization: Bearer $token" -H "Content-Type: application/json" \
            -d '{"mode":"summary","text":"Lift is the force that opposes weight. Drag opposes thrust."}' \
            http://127.0.0.1:47801/api/ai | tee answer.json
          python3 -c 'import json;a=json.load(open("answer.json"));assert a["engine"]=="local" and a["answer"].strip(), a'

