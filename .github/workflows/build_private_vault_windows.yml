name: Build Private Vault for Windows

# Builds the laptop program in PrivateVault/laptop/ into one Khazanti.exe,
# checks it end to end, and publishes it as a release.

on:
  push:
    paths:
      - 'PrivateVault/laptop/**'
      - '.github/workflows/build_private_vault_windows.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: private-vault-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: PrivateVault/laptop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: pip install -r requirements.txt

      - name: Test the server
        run: python khazanti_selftest.py

      - name: Build Khazanti.exe
        run: |
          python -c "import khazanti; khazanti.tray_icon_image().resize((256, 256)).save('icon.ico', sizes=[(256, 256), (64, 64), (32, 32), (16, 16)])"
          python -c "import json; json.dump({'build': ${{ github.run_number }}}, open('build_info.json', 'w'))"
          pyinstaller --onefile --noconsole --name Khazanti --icon icon.ico --add-data "index.html;." --add-data "build_info.json;." --hidden-import pystray._win32 khazanti.py

      - name: Test the built program
        env:
          EXPECT_BUILD: ${{ github.run_number }}
        run: python khazanti_selftest.py dist/Khazanti.exe

      # The program updates itself from this branch (see UPDATE_SOURCES).
      - name: Publish for one-click updates
        shell: bash
        run: |
          dir="$RUNNER_TEMP/updates"
          mkdir -p "$dir" && cp dist/Khazanti.exe "$dir/"
          echo "{\"build\": ${{ github.run_number }}, \"exe\": \"Khazanti.exe\"}" > "$dir/latest.json"
          cd "$dir"
          git init -q -b vault-builds-windows
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Khazanti build ${{ github.run_number }}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" HEAD:vault-builds-windows
          curl -sS "https://purge.jsdelivr.net/gh/${{ github.repository }}@vault-builds-windows/latest.json" > /dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: Khazanti-windows
          path: PrivateVault/laptop/dist/Khazanti.exe

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: private-vault-windows-${{ github.run_number }}
          name: خزنتي للابتوب - Windows (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          body: |
            حمّل Khazanti.exe وشغّله. إذا ظهر «Windows protected your PC» اضغط More info ثم Run anyway.
            عند السؤال عن جدار الحماية اختر السماح للشبكات الخاصة حتى يصل الهاتف إلى الخزنة.
          files: PrivateVault/laptop/dist/Khazanti.exe
