name: Verify the Jordan guide carries the filler channels (branch only)
on:
  push:
    branches: [claude/arabic-channels-epg-99099k]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - name: Build the Jordan guide for real
        run: python roya_jordan_epg.py
      - name: Check what came out
        run: |
          python -u - <<'PY'
          import xml.etree.ElementTree as ET
          from datetime import datetime, timedelta, timezone
          import filler_epg as F
          MECCA = timezone(timedelta(hours=3))
          def dt(s):
              off=s[-5:]; sign=1 if off[0]=="+" else -1
              return datetime.strptime(s[:14],"%Y%m%d%H%M%S").replace(
                  tzinfo=timezone(sign*timedelta(hours=int(off[1:3]),minutes=int(off[3:]))))

          r = ET.parse("roya_jordan_epg.xml").getroot()
          ids = [c.get("id") for c in r.findall("channel")]
          by = {}
          for p in r.findall("programme"): by.setdefault(p.get("channel"), []).append(p)

          print(f"Jordan guide: {len(ids)} channels, {len(r.findall('programme'))} programmes")
          print(f"  Roya + الجديد + الجزيرة present: "
                f"{'AlJadeed.lb' in ids} / {'AlJazeera.qa' in ids}")

          want = [c[0] for c in F.CHANNELS]
          missing = [w for w in want if w not in ids]
          print(f"\n  filler channels expected {len(want)}, missing {len(missing)}: {missing}")

          bad = 0
          for cid in want:
              ps = sorted(by.get(cid, []), key=lambda p: p.get("start"))
              if not ps:
                  print(f"  {cid:<22} NO PROGRAMMES"); bad += 1; continue
              durs = {(dt(p.get('stop'))-dt(p.get('start'))).total_seconds()/3600 for p in ps}
              gaps = sum(1 for a,b in zip(ps,ps[1:]) if dt(a.get("stop"))!=dt(b.get("start")))
              titles = {p.findtext("title") for p in ps}
              ok = durs == {3.0} and gaps == 0 and titles == {"Program 24/7"}
              bad += not ok
              print(f"  {cid:<22} {len(ps):>3} blocks {sorted(durs)}h gaps={gaps} {titles}"
                    + ("" if ok else "   <<< PROBLEM"))

          assert not missing, "filler channels missing from the Jordan guide"
          assert bad == 0, "a filler channel came out wrong"
          assert "AlJadeed.lb" in ids and "AlJazeera.qa" in ids, "lost Al Jadeed / Al Jazeera"
          print("\nPASS — the Jordan link carries Roya, الجديد, الجزيرة and all 13 filler channels")
          PY
