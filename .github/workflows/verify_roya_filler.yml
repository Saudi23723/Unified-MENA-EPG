name: Verify the filler names match the playlist (branch only)
on:
  push:
    branches: [claude/arabic-channels-epg-99099k]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - run: python roya_jordan_epg.py
      - name: Check
        run: |
          python -u - <<'PY'
          import xml.etree.ElementTree as ET
          from datetime import datetime, timedelta, timezone
          import filler_epg as F
          def dt(s):
              off=s[-5:]; sign=1 if off[0]=="+" else -1
              return datetime.strptime(s[:14],"%Y%m%d%H%M%S").replace(
                  tzinfo=timezone(sign*timedelta(hours=int(off[1:3]),minutes=int(off[3:]))))
          r = ET.parse("roya_jordan_epg.xml").getroot()
          ids = [c.get("id") for c in r.findall("channel")]
          by = {}
          for p in r.findall("programme"): by.setdefault(p.get("channel"), []).append(p)
          print(f"Jordan guide: {len(ids)} channels, {len(r.findall('programme'))} programmes")

          # exactly the names read off the user's TV
          playlist = ["أفلام","الكبير أوي","مرايا ياسر العظمة",
                      "الفصول الاربعة 1","الفصول الاربعة 2",
                      "ضيعة ضايعة 1","ضيعة ضايعة 2",
                      "يوميات مدير عام 1","يوميات مدير عام 2","الخبرة",
                      "عيلة 5 نجوم","عيلة 6 نجوم","ببساطة 1",
                      "الواق الواق","الطواريد"]
          allnames = {d.text for c in r.findall("channel") for d in c.findall("display-name")}
          missing = [p for p in playlist if p not in allnames]
          print(f"\nplaylist names matched: {len(playlist)-len(missing)}/{len(playlist)}")
          for p in playlist:
              print(f"   {'OK ' if p in allnames else 'MISS'}  {p}")

          bad = 0
          for cid, _key, names in F.CHANNELS:
              ps = sorted(by.get(cid, []), key=lambda p: p.get("start"))
              durs = {(dt(p.get('stop'))-dt(p.get('start'))).total_seconds()/3600 for p in ps}
              gaps = sum(1 for a,b in zip(ps,ps[1:]) if dt(a.get("stop"))!=dt(b.get("start")))
              titles = {p.findtext("title") for p in ps}
              ok = ps and durs=={3.0} and gaps==0 and titles=={"Program 24/7"}
              bad += not ok
              if not ok: print(f"   PROBLEM {cid} {len(ps)} {durs} gaps={gaps} {titles}")

          assert not missing, f"playlist names not matched: {missing}"
          assert bad == 0, "a filler channel came out wrong"
          assert "AlJadeed.lb" in ids and "AlJazeera.qa" in ids, "lost Al Jadeed / Al Jazeera"
          print(f"\nPASS — {len(F.CHANNELS)} filler channels, all 15 playlist names matched, "
                f"الجديد and الجزيرة intact")
          PY
