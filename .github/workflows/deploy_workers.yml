name: Deploy the DreamTV relays

# Uploads cloudflare/worker2.js to the seven relays when it changes (tools/deploy_workers.py), with the Cloudflare
# API token kept in the repository secrets. Each relay keeps its own provider address.
on:
  push:
    branches: [main]
    paths: [cloudflare/worker2.js]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set +e
          python tools/deploy_workers.py > _deploy.txt 2>&1; c=$?
          cat _deploy.txt
          mkdir -p _s && { date -u; cat _deploy.txt; } > _s/deploy.txt
          cd _s && git init -q -b deploy-status && git add -A && git -c user.name=bot -c user.email=bot@x commit -q -m s \
            && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" deploy-status
          exit $c
