# Ask whether MuhtrefSports' posters can be read, and whether what they
# carry is already on the board. It commits nothing and publishes nothing.
name: Probe MuhtrefSports overlap

on:
  workflow_dispatch:
  push:
    branches: [claude/arabic-channels-epg-99099k]
    paths:
      - "probes/probe_muhtref_overlap.py"
      - ".github/workflows/probe_muhtref_overlap.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OCR and Python dependencies
        run: |
          tools/apt_install.sh tesseract-ocr tesseract-ocr-ara tesseract-ocr-eng
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify OCR languages
        run: |
          tesseract --list-langs | grep -qx ara
          tesseract --list-langs | grep -qx eng

      - run: python -u probes/probe_muhtref_overlap.py
