name: Update Alwan Sports EPG

on:
  workflow_dispatch:

  schedule:
    # Check Telegram once every hour.
    - cron: "7 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Build Alwan XMLTV
        run: |
          python update_alwan_epg.py

      - name: Commit Alwan EPG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add alwan_sports_epg_v2.xml

          if git diff --cached --quiet; then
            echo "No Alwan EPG changes to commit."
            exit 0
          fi

          git commit -m "Update Alwan Sports EPG"
          git pull --rebase origin main
          git push origin main
