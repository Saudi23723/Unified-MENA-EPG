name: Update Alwan Sports EPG

on:
  workflow_dispatch:

  schedule:
    # Check Telegram once every hour.
    - cron: "7 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Build Alwan XMLTV
        run: |
          python update_alwan_epg.py

      - name: Commit Alwan EPG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add alwan_sports_epg.xml

          if git diff --cached --quiet; then
            echo "No Alwan EPG changes to commit."
            exit 0
          fi

          git commit -m "Update Alwan Sports EPG"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin main; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push rejected (another workflow pushed first), retrying ($attempt/5)..."
            sleep $(( (RANDOM % 5) + 2 ))
          done
          echo "Failed to push after 5 attempts"
          exit 1
