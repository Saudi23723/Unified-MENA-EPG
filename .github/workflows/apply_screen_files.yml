name: Apply screen files (fast)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the updated screen files
        run: |
          set -e
          base="https://id-preview--ea5e799b-bf8f-4a5b-a637-474ca2ed0e2f.lovable.app/api/public/patch"
          for f in match_board.py match_screen_video.py other_sports_epg.py; do
            curl -fsSL "$base/$f" -o "$f.new"
            python3 -c "import ast,sys;ast.parse(open(sys.argv[1]).read())" "$f.new"
            mv "$f.new" "$f"
          done
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add match_board.py match_screen_video.py other_sports_epg.py
          git diff --cached --quiet && echo "nothing to do" && exit 0
          git commit -m "Screens: no clock, one row per card, keep events with no broadcaster"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
