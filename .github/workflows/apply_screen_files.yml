name: Fast screen apply
on: {workflow_dispatch: {}}
permissions: {contents: write}
jobs:
  a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -e
          curl -fsSL -o match_board.py https://d.uguu.se/AsNqpnrf.py
          curl -fsSL -o match_screen_video.py https://d.uguu.se/dvzzbFNs.py
          curl -fsSL -o other_sports_epg.py https://n.uguu.se/ksRLsXkP.py
          curl -fsSL -o today_matches_epg.py https://n.uguu.se/yAlwKGFN.py
          curl -fsSL -o wnba_espn.py https://d.uguu.se/UZPQkuOV.py
          python -c "import ast;[ast.parse(open(f,encoding='utf-8').read()) for f in ('match_board.py','match_screen_video.py','other_sports_epg.py','today_matches_epg.py','wnba_espn.py')]"
          git config user.name epg-bot
          git config user.email epg-bot@users.noreply.github.com
          git add -A
          git commit -m "Screens: no clock, one card row, league colours, youth/MLS rules, WNBA, 3-day window" || true
          git pull --rebase
          git push
