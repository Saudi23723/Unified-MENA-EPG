name: Update Jordan Sports EPG

on:
  # Scheduled builds all live in one workflow now — "Build every EPG",
  # which runs this guide's generator along with every other one. See
  # build_all_epg.py for why: fifteen separate crons had GitHub delaying
  # and dropping this repository's scheduled events for hours at a time.
  #
  # This file is kept as the way to rebuild THIS guide on its own, by
  # hand, when something about it needs looking at. It is not part of the
  # regular schedule and nothing chains to it.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Generate Jordan Sports EPG
        run: |
          python JORDAN_SPORTS_FINAL_VERIFIED.py

      - name: Validate XMLTV
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse("jordan_sports_epg.xml").getroot()

          assert root.tag == "tv"
          assert root.find("channel") is not None
          assert root.findall("programme")

          print("JORDAN SPORTS XMLTV VALIDATION PASS")
          PY

      - name: Commit updated EPG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add jordan_sports_epg.xml

          if git diff --cached --quiet; then
            echo "No Jordan Sports EPG changes to commit."
            exit 0
          fi

          git commit -m "Update Jordan Sports EPG"
          git pull --rebase origin main
          git push origin main
