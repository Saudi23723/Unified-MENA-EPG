name: Update Tabii Spor EPG

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "update_tabii_epg.py"
      - ".github/workflows/update_tabii_epg.yml"

  schedule:
    - cron: "37 * * * *"
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Build XMLTV
        run: |
          python update_tabii_epg.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add tabii_spor_1_10_epg.xml

          if git diff --cached --quiet; then
            echo "No EPG changes to commit."
          else
            git commit -m "Update Tabii Spor 1-10 EPG"
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push origin main; then
                echo "Pushed on attempt $attempt"
                exit 0
              fi
              echo "Push rejected (another workflow pushed first), retrying ($attempt/5)..."
              sleep $(( (RANDOM % 5) + 2 ))
            done
            echo "Failed to push after 5 attempts"
            exit 1
          fi
