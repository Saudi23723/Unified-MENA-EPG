name: Update Tabii Spor EPG

on:
  workflow_dispatch:
  schedule:
    # 15:20 UTC = 18:20 Turkey time (UTC+3)
    - cron: "20 15 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build XMLTV
        run: python update_tabii_epg.py

          git add tabii_spor_1_10_epg.xml

          if git diff --cached --quiet; then
            echo "No EPG changes to commit."
            exit 0
          fi

          git commit -m "Update Tabii Spor 1-10 EPG"

          git pull --rebase origin main
          git push origin main
