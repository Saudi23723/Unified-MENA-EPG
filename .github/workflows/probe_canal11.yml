# Ask which page carries Canal 11's fixtures, and whether it publishes an
# instant or a printed clock. It commits nothing and publishes nothing.
name: Probe Canal 11

on:
  workflow_dispatch:
  push:
    branches: [claude/arabic-channels-epg-99099k]
    paths:
      - "probes/probe_canal11.py"
      - ".github/workflows/probe_canal11.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -u probes/probe_canal11.py
