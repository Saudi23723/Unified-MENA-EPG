name: probe
on:
  push:
    branches: [probe-shasha]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: probe-shasha, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q -r requirements.txt
      - run: git fetch -q origin main && git checkout origin/main -- "*.xml" && python tools/_zain_probe.py
