name: probe
on:
  push:
    branches: [probe-shasha]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: probe-shasha}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q -r requirements.txt
      - run: python tools/_zain_probe.py 2>&1 | grep "::notice" || true
