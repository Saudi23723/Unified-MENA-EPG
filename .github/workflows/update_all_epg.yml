name: Build every EPG

# The one scheduled build, and it bridges the gaps the scheduler leaves.
#
# Fifteen hourly crons plus a merge chained to all of them came to ~750
# workflow runs a day, and GitHub answered by delaying this repository's
# scheduled events by up to 45 minutes and dropping them for eight to
# eleven hours at a stretch. Cutting that to three events an hour did not
# fix it — 14:27, 14:47, 15:07 and 16:07 were all dropped too. See
# build_all_epg.py for the measurements.
#
# So correctness does not depend on the scheduler firing often. A run
# builds nine times, twenty minutes apart, publishing each pass as it
# finishes: one landed event covers not quite three hours on its own.
#
# Two events an hour, at :07 and :37, are two chances of starting a fresh
# ticker after a silence — and cancel-in-progress means a new one
# replaces the running one instead of queueing behind it, so they can
# never pile up. A cancellation almost always lands during a sleep, and
# whatever the cancelled run had already built is already pushed.
#
# :07 and :37 rather than :00 and :30 on purpose. GitHub's own guidance
# is to avoid the top of the hour, and the load spikes that eat scheduled
# events land on the round minutes.
#
# A pass measured 5m29s for all thirteen generators and the merge.

on:
  schedule:
    - cron: "7 * * * *"
    - cron: "37 * * * *"

  workflow_dispatch:

  # A change to any generator, to the shared library, or to this workflow
  # rebuilds everything rather than waiting for the next tick. One pass,
  # not nine — there is no gap to bridge.
  push:
    branches:
      - main
    paths:
      - "*.py"
      - "requirements.txt"
      - ".github/workflows/update_all_epg.yml"

permissions:
  contents: write

concurrency:
  group: build-every-epg
  # A newly landed event replaces the ticker still running from an
  # earlier one. Queueing would stack three-hour runs behind each other
  # for ever; cancelling costs at most one pass, and every pass before it
  # has already been pushed.
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Nine passes twenty minutes apart, the last ending around +166. Each
    # pass has its own sixteen-minute budget, so this is the outer limit
    # and not the working one.
    timeout-minutes: 190

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Fajer reads its schedule off a poster image, so the OCR engine and
      # both language packs are a hard requirement for that guide. It is
      # installed once here instead of once per guide.
      - name: Install the OCR engine
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ara tesseract-ocr-eng
          tesseract --list-langs
          tesseract --list-langs | grep -qx ara
          tesseract --list-langs | grep -qx eng

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Identify the committer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # The script pushes at the end of every pass, so a run cancelled or
      # killed part way through has already published what it finished.
      # Only a scheduled run bridges the hour; anything else builds once.
      - name: Build every guide, merge them, and publish each pass
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python -u build_all_epg.py
          else
            python -u build_all_epg.py --once
          fi

      # A backstop, not the mechanism: if the script died between writing
      # a guide and pushing it, the work is still on disk and this gets it
      # out rather than letting it be thrown away with the runner.
      - name: Push anything the script left behind
        if: always()
        run: |
          git add -- '*.xml'
          if git diff --cached --quiet; then
            echo "Nothing left uncommitted."
            exit 0
          fi
          git commit -m "Update every EPG"
          for attempt in 1 2 3 4 5; do
            git rebase --abort 2>/dev/null || true
            git merge --abort 2>/dev/null || true
            git pull --rebase origin main
            if git push origin HEAD:main; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push rejected, retrying ($attempt/5)..."
            sleep $(( (RANDOM % 5) + 2 ))
          done
          echo "Failed to push after 5 attempts"
          exit 1
