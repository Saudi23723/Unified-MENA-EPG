name: Health check

# Reads the published guides and reports what is wrong with them.
# It never writes, never commits and never touches a link — a red run
# here means a guide needs attention, not that anything was changed.

on:
  # Deliberately NOT triggered by the merge. It was, briefly, to stop a
  # check landing in the gap between a source rebuild and the merge
  # catching up — but the merge now follows its sources within seconds, so
  # that gap barely exists, while the merge itself runs after each of
  # fourteen sources. Chaining to it ran this check seven times in two
  # minutes, and one real failure then arrives as seven identical emails.
  #
  # Freshness is a thing to look at twice a day, not after every rebuild.
  schedule:
    - cron: "25 5,17 * * *"
  workflow_dispatch:
  # AND NOT ON A REBUILT GUIDE EITHER. "*.xml" was in this list, and a
  # guide is what the bots push all day — so a check that is red for a
  # real reason sent that same reason again on every merge that touched
  # any guide. It is the fault the workflow_run trigger was removed for,
  # arriving by a second road: one problem, many identical emails, and
  # the tenth is read less carefully than the first.
  #
  # What is left is the two files that decide what this check MEANS. A
  # rule changing is a reason to run it again immediately; a guide being
  # rebuilt for the ninth time today is not — the schedule covers that.
  push:
    branches: [main]
    paths:
      - "health_check.py"
      - "merge_epg.py"
      - ".github/workflows/health_check.yml"

permissions:
  contents: read
  # To start the screens and the guides again when GitHub has let them
  # die (tools/revive_workflows.sh).
  actions: write

concurrency:
  group: health-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Bring back any build GitHub has let die
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tools/revive_workflows.sh update_today_matches.yml update_all_epg.yml:30
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # A push here changes the rules — often merge_epg.py's list of
      # sources. The published merged link catches up only on the next
      # build, so checking it as published reports the channel just added
      # as "missing from the merged link" (30 September, Formula 1): a
      # failure email for a change that was right. On a push, merge first
      # in this checkout and check what the new rules produce; the
      # schedule still checks the published link itself.
      - name: Merge as the new rules say (push only)
        if: github.event_name == 'push'
        run: |
          pip install -q -r requirements.txt
          python -u merge_epg.py
      - name: Check every guide and the merged link
        run: python -u health_check.py
