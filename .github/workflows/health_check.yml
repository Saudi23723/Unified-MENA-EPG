name: Health check

# Reads the published guides and reports what is wrong with them.
# It never writes, never commits and never touches a link — a red run
# here means a guide needs attention, not that anything was changed.

on:
  schedule:
    - cron: "25 5,17 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "*.xml"
      - "health_check.py"
      - "merge_epg.py"
      - ".github/workflows/health_check.yml"

permissions:
  contents: read

concurrency:
  group: health-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check every guide and the merged link
        run: python -u health_check.py
