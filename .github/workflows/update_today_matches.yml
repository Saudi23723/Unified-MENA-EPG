name: Build today's matches

on:
  workflow_dispatch:
  # ONCE EVERY HALF HOUR, NOT TWELVE TIMES AN HOUR — and no chaining.
  #
  # THE FAULT THIS REPLACES, and it was mine. The job publishes eight
  # times over 175 minutes now, and concurrency below cancels a running
  # job whenever a new one starts. With a cron every five minutes AND a
  # workflow_run chained to "Build every EPG", something started every
  # few minutes and killed the ticker before it had published anything:
  # run 862 was cancelled two and a half minutes in, mid-build. The
  # boards had not moved since 15:47 while runs kept starting and dying.
  #
  # Cancelling is no longer how a fresh trigger is handled at all — see
  # concurrency below — so a landed slot is never thrown away. It is
  # held as this run's successor and starts the moment this one ends.
  #
  # So the trigger rate is matched to what one run now covers. Two
  # events an hour are two chances to start a fresh ticker after a
  # silence, and each one covers nearly three hours by itself — the
  # same arithmetic "Build every EPG" already runs on, which is why it
  # has never had this problem.
  #
  # :11 and :41 rather than :00 and :30 on purpose, and offset from
  # "Build every EPG" at :07 so the two do not contend: GitHub's own
  # guidance is to avoid the round minutes, where the load spikes that
  # eat scheduled events land.
  schedule:
    - cron: "11,41 * * * *"

concurrency:
  group: today-matches
  # A TRIGGER THAT LANDS MID-RUN QUEUES BEHIND IT; IT DOES NOT KILL IT.
  #
  # This was true, and it left the boards frozen twice in one morning.
  # The job runs its ticker for 175 minutes and then exits, and the ONLY
  # thing that starts another is the cron — which GitHub drops. Measured
  # 2026-09-12: run 902's ticker ended 07:58 and the 08:11 slot never
  # arrived, so nothing published for 65 minutes; run 904 ended 12:13,
  # its 12:11 slot never arrived either. Every slot that DID land during
  # those three hours was thrown away by cancel-in-progress, because at
  # the time it landed a ticker was running and cancelling was the whole
  # point.
  #
  # Queued instead, one of those slots becomes the successor: GitHub
  # holds exactly one pending run per group and cancels any earlier
  # pending one, so they still cannot pile up — and the moment the
  # ticker exits, the pending run starts. The gap closes without the
  # scheduler having to fire at the right minute, only at SOME minute in
  # the three hours a run covers.
  #
  # It also ends the other half of the same fault: a hand-dispatch used
  # to kill whatever was mid-build. Run 873 had reordered correctly at
  # 23:39 and was cancelled at 23:42 before it could push.
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # A PASS EVERY FIVE MINUTES NEEDS THE ROOM TO RUN THEM.
    # At 20 this job was killed inside the first sleep, so the ticker
    # below would never have reached pass 2 and the whole change would
    # have been decoration. 175 matches channel 6's; the ticker stops
    # itself at 165 so the last pass publishes rather than being cut.
    timeout-minutes: 175
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Install rendering tools
        run: |
          tools/apt_install.sh fonts-freefont-ttf fonts-dejavu-core ffmpeg
      - name: Identify committer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Rebuild channel 1
        run: python -u today_matches_epg.py
      - name: Rebuild channel 2
        run: python -u other_sports_epg.py
      - name: Rebuild baseball and WNBA channel
        run: python -u ball_sports_epg.py
      - name: Rebuild NBA and NFL channel
        run: python -u hoops_gridiron_epg.py
      - name: Rebuild Turkish PPV channel
        run: python -u turkish_ppv_epg.py
      - name: Rebuild Formula 1 channel
        run: python -u f1_epg.py
      # THREE DASHBOARDS NOTHING WAS BUILDING. news_epg.py,
      # weather_epg.py and prayer_epg.py exist, and no workflow ran
      # either them or the encoder for their screens: today_news,
      # dubai_news, today_weather, dubai_weather and today_prayer had
      # no automatic path at all, so الأخبار and الطقس and مواقيت
      # الصلاة sat on whatever render was last pushed by hand.
      - name: Rebuild news
        run: python -u news_epg.py
      - name: Rebuild weather
        run: python -u weather_epg.py
      - name: Rebuild prayer times
        run: python -u prayer_epg.py
      - name: Encode news
        run: python -u match_screen_video.py today_news
      - name: Encode UAE news
        run: python -u match_screen_video.py dubai_news
      - name: Encode weather
        run: python -u match_screen_video.py today_weather
      - name: Encode UAE weather
        run: python -u match_screen_video.py dubai_weather
      - name: Encode prayer times
        run: python -u match_screen_video.py today_prayer
      - name: Encode channel 1
        run: python -u match_screen_video.py today_matches
      - name: Encode channel 2
        run: python -u match_screen_video.py other_sports
      - name: Encode UAE channel 1
        run: python -u match_screen_video.py dubai_matches
      - name: Encode UAE channel 2
        run: python -u match_screen_video.py dubai_sports
      - name: Encode baseball and WNBA channel
        run: python -u match_screen_video.py ball_sports
      - name: Encode UAE baseball and WNBA channel
        run: python -u match_screen_video.py dubai_ball_sports
      - name: Encode NBA and NFL channel
        run: python -u match_screen_video.py hoops_gridiron
      - name: Encode UAE NBA and NFL channel
        run: python -u match_screen_video.py dubai_hoops_gridiron
      - name: Encode Formula 1 channel
        run: python -u match_screen_video.py f1
      - name: Encode UAE Formula 1 channel
        run: python -u match_screen_video.py dubai_f1
      - name: Encode Turkish PPV channel
        run: python -u match_screen_video.py turkish_ppv
      - name: Encode UAE Turkish PPV channel
        run: python -u match_screen_video.py dubai_turkish_ppv
      - name: Verify screens
        run: |
          set +e
          python -u channel_gate_selftest.py 2>&1 | tee /tmp/gate.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            # A GATE THAT NAMES A SCREEN HOLDS BACK THAT SCREEN. It used
            # to stop the publish outright, so five gates about Turkish
            # PPV froze all thirteen channels' boards, twice in one
            # evening. quarantine_screens.py puts a named screen back to
            # the copy already published and lets the rest go out; a
            # failure that names no screen is about the whole build and
            # still publishes nothing, which is what the exit code here
            # carries.
            #
            # The two gates this used to grep past by name are fixed
            # rather than excused: the ROW one was handing draw_board
            # eighteen rows so alike that without_repeats folded them to
            # three, and the ALWAN one demanded a fixture that rolled
            # off Alwan's schedule the day after it was written.
            python -u quarantine_screens.py /tmp/gate.log
          fi
      # THE PLAYLIST IS WRITTEN AFTER THE SCREENS ARE VERIFIED, not
      # before. It used to run ahead of the gate, so when the gate
      # named a screen and quarantine_screens.py put that screen's
      # files back, the playlist had ALREADY listed it — and the row
      # went out pointing at a stream that was no longer there. That is
      # a dead channel in the player, which is worse than an absent
      # one: an absent channel is a gap, a dead one is a black screen
      # somebody tunes to and waits on.
      #
      # Written here it sees what actually survived. The builder already
      # refuses to list a screen whose m3u8 is missing — "has not been
      # encoded — left out of the playlist this pass" — so a
      # quarantined screen simply does not appear until it is fixed.
      - name: Write playlists
        run: python -u sports_dashboard_m3u.py || { test -s ai_sports_dashboard.m3u && test -s ai_sports_dashboard_dubai.m3u; }

      - name: Publish refreshed indicators
        run: python -u publish_screens.py

      # ─── AND AGAIN, EVERY FIVE MINUTES, FOR THE WHOLE WINDOW ─────────
      #
      # THE CRON IS NOT ARRIVING. This asks for a run every five minutes
      # — twelve slots an hour — and measured across 2026-09-10 it fired
      # twice in three hours, then not at all between 15:47 and 17:50.
      # For two hours the football, sports, baseball, NBA/NFL, Turkish
      # and Formula 1 boards all sat on a stale render while somebody
      # dispatched this by hand, hour after hour. That is not a fix, and
      # doing it again tomorrow would not be one either.
      #
      # The repository already answered this question twice. "Build every
      # EPG" builds nine times over its window, and channel 6 twenty
      # times, eight minutes apart, both for exactly this reason:
      # correctness must not depend on the scheduler firing often. This
      # brings the same answer to the workflow that had been left out of
      # it — one landed event now covers not quite three hours on its
      # own, so a dropped slot costs nothing.
      #
      # ADDED AFTER the steps above rather than replacing them, on
      # purpose: the first pass is still the steps exactly as they were,
      # already published before this runs at all. If this step never
      # executes, the workflow behaves precisely as it did before.
      #
      # A pass that fails does not stop the ones after it. A source that
      # answers badly for one pass should cost one pass, not the
      # remaining two hours — and whatever the failing pass had already
      # published stays published.
      #
      # RUN TO THE WINDOW, NOT TO A COUNT. Fourteen passes was a guess at
      # how many fit, and run 904 proved it wrong in the expensive
      # direction: it was still inside pass fourteen when the 175-minute
      # timeout killed it, mid-build. A deadline stops cleanly with a
      # published pass behind it, and it stays right when a pass gets
      # slower or faster — which it does, with the number of matches.
      - name: Keep publishing while the scheduler is quiet
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          # Ten minutes inside the job's own timeout, so the last pass
          # finishes and pushes rather than being cut off part-way.
          deadline=$(( $(date +%s) + 165 * 60 ))
          pass=1
          while [ "$(date +%s)" -lt "$deadline" ]; do
            sleep 300
            pass=$(( pass + 1 ))
            echo "───── pass $pass ─────"
            (
              set -e
              for build in today_matches_epg other_sports_epg \
                           ball_sports_epg hoops_gridiron_epg \
                           turkish_ppv_epg f1_epg \
                           news_epg weather_epg prayer_epg; do
                python -u "$build.py"
              done
              for screen in today_matches other_sports \
                            dubai_matches dubai_sports ball_sports \
                            dubai_ball_sports hoops_gridiron \
                            dubai_hoops_gridiron f1 dubai_f1 \
                            turkish_ppv dubai_turkish_ppv \
                            today_news dubai_news today_weather \
                            dubai_weather today_prayer; do
                python -u match_screen_video.py "$screen"
              done
              set +e
              python -u channel_gate_selftest.py 2>&1 | tee /tmp/gate.log
              status=${PIPESTATUS[0]}
              set -e
              if [ "$status" -ne 0 ]; then
                python -u quarantine_screens.py /tmp/gate.log
              fi
              # After the gate, for the reason above the first-pass step.
              python -u sports_dashboard_m3u.py \
                || { test -s ai_sports_dashboard.m3u \
                     && test -s ai_sports_dashboard_dubai.m3u; }
              python -u publish_screens.py
            ) || echo "::warning::pass $pass did not finish — whatever it published stands, and the next one follows"
          done
          echo "───── $pass pass(es) published; the window is up ─────"
