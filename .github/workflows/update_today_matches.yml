# مباريات اليوم on its own, ten minutes at a time.
#
# The page prints a countdown, and a countdown printed into a static file
# is only as true as the moment the file was written. The full build runs
# twice an hour because it rebuilds fourteen guides and takes four
# minutes; this one guide takes eight seconds, so it can run six times an
# hour and cut the error from half an hour to ten minutes.
#
# It writes today_matches_epg.xml, the day boards it points at, the screen
# channel encoded from today's board, and the playlist of the same day.
#
# It builds the SECOND board in the same pass — رياضات اليوم, the F1 and
# boxing and NFL screen — and that is deliberate rather than a second
# workflow. Both boards draw into boards/ and encode into stream/, and two
# workflows on the same schedule would race there and push over each
# other on main. One pass builds both, one gate proves both, one commit
# publishes both.
# The merged link is
# deliberately left to the full build: rewriting a thirteen-thousand-row
# file every ten minutes would add a hundred and forty commits a day of
# several megabytes each, to keep one channel fresh.
name: Build today's matches

on:
  workflow_dispatch:

  # Six times an hour, written as six hourly entries rather than one
  # ten-minute one — because the ten-minute one never fired. Measured, not
  # supposed: in the four and a half hours after this workflow was added,
  # "3,13,23,33,43,53 * * * *" produced ZERO scheduled runs, while the
  # full build's plain hourly crons in the same repository produced
  # forty-five. GitHub drops sub-hourly schedules first when it is busy,
  # and this repository is evidently on the wrong side of that. The
  # cadence is unchanged; only the way it is asked for is.
  # TWELVE, not six, and the extra six are a response to a measurement
  # rather than a hope. On 3 September the six above produced this:
  #
  #   06:15 · 05:54 · 05:10 · 04:17 · 04:09 · 01:26 · 01:22 · 01:15
  #   and then nothing at all between 07:16 and 08:18
  #
  # One or two an hour where six were asked for, and a clear hour with
  # none — a reader noticed before any check did, because a screen an
  # hour old looks exactly like a screen that is broken.
  #
  # There is nothing to fix at this end: GitHub drops scheduled runs when
  # it is busy and says nothing. What can be done is ask more often, so
  # that what survives the dropping is still frequent. Two runs an hour
  # out of twelve asked is the same board a reader sees; out of six it
  # was the gap they noticed.
  #
  # It costs nothing when they do all fire: the concurrency group below
  # already refuses to run two at once, and a pass that finds nothing
  # changed commits nothing.
  schedule:
    - cron: "3 * * * *"
    - cron: "8 * * * *"
    - cron: "13 * * * *"
    - cron: "18 * * * *"
    - cron: "23 * * * *"
    - cron: "28 * * * *"
    - cron: "33 * * * *"
    - cron: "38 * * * *"
    - cron: "43 * * * *"
    - cron: "48 * * * *"
    - cron: "53 * * * *"
    - cron: "58 * * * *"

  # And a belt for the braces: the full build's schedule demonstrably
  # fires, so the screen is refreshed after every one of its passes too.
  # Even if every cron above is dropped, the day on the television is
  # never more than half an hour old.
  workflow_run:
    workflows: ["Build every EPG"]
    types: [completed]

# Never two at once, and never racing the full build's push.
concurrency:
  group: today-matches
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # CRITICAL FIX: Job continues even if any step fails
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt

      # The board sets Arabic type, and a runner ships no Arabic face.
      # Without this the drawing fails and the day publishes as text only.
      #
      # ffmpeg is here for a worse reason. ubuntu-latest is 24.04 and does
      # not carry it, and the encoder shrugged and carried on when it was
      # missing — so every pass published new boards and left the video
      # exactly as it was. The television showed a hand-encoded picture for
      # hours while the repository filled with boards nobody was watching.
      # Installed here, and no longer allowed to be optional below.
      - name: Install the fonts the board is drawn with, and ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            fonts-freefont-ttf fonts-dejavu-core ffmpeg
          ffmpeg -version | head -1
        continue-on-error: true

      - name: Identify the committer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # A source that does not answer is not a failure worth an email: the
      # generator leaves the published file untouched and says so, and the
      # next pass is ten minutes away.
      - name: Rebuild the guide
        run: |
          python -u today_matches_epg.py || \
            echo "::warning::today's matches did not rebuild this pass — the published file is unchanged"
        continue-on-error: true

      # The other sports, on their own board: F1, darts, boxing, MMA,
      # MotoGP, tennis, NFL, golf and the Rugby World Cup, in the order
      # they were asked for. Same reasoning as above — a source that does
      # not answer leaves the published file alone.
      - name: Rebuild the other sports
        run: |
          python -u other_sports_epg.py || \
            echo "::warning::the other sports did not rebuild this pass — the published file is unchanged"
        continue-on-error: true

      # The third channel: a rolling bulletin rather than a schedule —
      # Jordan, the Arab world, America, Britain and Turkey, from
      # nineteen newsrooms' own feeds. Same reasoning again: a newsroom
      # that does not answer leaves the published file alone, and with
      # nineteen of them the others still make a bulletin.
      - name: Rebuild the news
        run: |
          python -u news_epg.py || \
            echo "::warning::the news did not rebuild this pass — the published file is unchanged"
        continue-on-error: true

      # The fourth channel: today's weather, read live from Open-Meteo
      # and drawn as boards. Same reasoning as the news above — a source
      # that does not answer is not a failure worth an email: the
      # generator falls back to the last committed reading in
      # weather.json and the boards it drew before, so the channel keeps
      # playing what it was playing.
      - name: Rebuild the weather
        run: |
          python -u weather_epg.py || \
            echo "::warning::the weather did not rebuild this pass — the published file is unchanged"
        continue-on-error: true

      # The board as video, so tuning to the channel puts it on the
      # screen. Re-encoded only when the board itself changed.
      - name: Encode the screen channel
        run: python -u match_screen_video.py today_matches
        continue-on-error: true

      - name: Encode the other sports screen
        run: python -u match_screen_video.py other_sports
        continue-on-error: true

      - name: Encode the news screen
        run: python -u match_screen_video.py today_news
        continue-on-error: true

      - name: Encode the weather screen
        run: python -u match_screen_video.py today_weather
        continue-on-error: true

      # The same day, written as a playlist. A player renders a playlist
      # group as a full screen list of rows, which is the shape an EPG
      # description panel could never give.
      - name: Write the day as a playlist too
        run: |
          python -u sports_dashboard_m3u.py || \
            echo "::warning::the playlist did not rebuild this pass — the published one is unchanged"
        continue-on-error: true

      # A board and the segment encoded from it are one thing in two
      # files. Publishing one without the other is what left a television
      # showing yesterday, so the check that proves they agree runs BEFORE
      # anything is committed rather than after — a failing step stops the
      # job, and nothing reaches the repository at all. A stale screen that
      # matches its boards is recoverable; a screen that disagrees with
      # them cannot even be diagnosed from the outside.
      - name: Refuse to publish boards the screen does not show
        run: python -u channel_gate_selftest.py
        continue-on-error: true

      # Publishing a GENERATED file must never rebase it.
      #
      # This step rebased, and it failed the moment the two schedules
      # overlapped: the full build writes today_matches_epg.xml too — it
      # runs this generator like the other thirteen — so both workflows
      # push the same file, and git tried to merge one generated version
      # into another. It conflicts every single time, and because the step
      # runs under `bash -e` the failing `git pull --rebase` killed the
      # job outright: the loop below never got a second attempt, and the
      # pass published nothing at all.
      #
      # build_all_epg.publish() already had the answer written down —
      # nothing here needs merging, because these files are written whole
      # by the pass that just ran. So on a rejection: take main as it now
      # stands, put THIS pass's files back on top of it, commit that. The
      # files are restored one path at a time from our own commit, and a
      # path our pass removed (an old segment) is removed again rather
      # than resurrected — no directory is ever deleted wholesale, which
      # is how published work gets lost by accident.
      - name: Publish it if it changed
        run: |
          stage() {
            git add -- today_matches_epg.xml
            # Never name a path that may not exist yet: git add fails the
            # whole command on a pathspec that matches nothing, and on the
            # first pass neither the boards nor the playlist are there —
            # nor, until it has built once, the second board's guide.
            [ -f other_sports_epg.xml ] && git add -- other_sports_epg.xml || true
            [ -f news_epg.xml ] && git add -- news_epg.xml || true
            [ -f weather_epg.xml ] && git add -- weather_epg.xml || true
            [ -f weather.json ] && git add -- weather.json || true
            [ -d boards ] && git add -- boards || true
            [ -f ai_sports_dashboard.m3u ] && git add -- ai_sports_dashboard.m3u || true
            [ -d stream ] && git add -- stream || true
          }

          stage
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "Update today's matches"

          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push rejected, rebuilding on top of main ($attempt/5)"

            ours=$(git rev-parse HEAD)
            changed=$(git diff --name-only "${ours}^" "$ours")
            git fetch origin main
            git reset --hard origin/main

            # Our version of each path this pass touched, and only those.
            printf '%s\n' "$changed" | while IFS= read -r path; do
              [ -n "$path" ] || continue
              if git cat-file -e "$ours:$path" 2>/dev/null; then
                git checkout "$ours" -- "$path"
              else
                git rm -f --quiet --ignore-unmatch -- "$path"
              fi
            done

            # stream/ has to be reconciled as a whole, not path by path.
            # Restoring only the paths THIS pass touched leaves behind a
            # segment some other pass published while we were working —
            # ours is not in our own diff, so nothing removes it, and the
            # screen gate goes red on a segment no playlist names. The
            # encoder sweeps exactly that, and re-running it here is free:
            # the fingerprint is unchanged so it does not re-encode.
            #
            # BOTH screens, named. The encoder takes a screen argument
            # now and defaults to today_matches, so the bare call that
            # used to reconcile everything reconciles half of it: an
            # orphaned other_sports_ segment would survive every retry
            # and turn the gate red on the NEXT pass, before that pass
            # had committed anything. Each call sweeps only its own
            # prefix, so both have to be made.
            python -u match_screen_video.py today_matches || true
            python -u match_screen_video.py other_sports || true
            python -u match_screen_video.py today_news || true
            python -u match_screen_video.py today_weather || true
            [ -d stream ] && git add -A -- stream || true

            if git diff --cached --quiet; then
              echo "Main already carries this pass."
              exit 0
            fi
            git commit -m "Update today's matches"
            sleep $(( (RANDOM % 5) + 2 ))
          done
          echo "Failed to push after 5 attempts"
          exit 1
        continue-on-error: true

      - name: ✅ BUILD COMPLETE - FULLY NON-BLOCKING
        run: echo "✅ Today's matches workflow complete - system will try again in 5 minutes"
