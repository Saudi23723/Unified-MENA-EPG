name: Update SHASHA Guide EPG

on:
  workflow_dispatch:

  schedule:
    - cron: "27 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Build SHASHA Guide XMLTV
        run: |
          python update_shasha_guide_epg.py

      - name: Validate SHASHA Guide XMLTV
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          p = Path("shasha_guide_epg.xml")
          if not p.exists():
              raise SystemExit("ERROR: shasha_guide_epg.xml not created")

          root = ET.parse(p).getroot()
          channels = root.findall("channel")
          if not any(c.get("id") == "ShashaGuide" for c in channels):
              raise SystemExit("ERROR: ShashaGuide channel missing")

          print(
              "Validated SHASHA Guide:",
              len(channels),
              "channel definitions /",
              len(root.findall("programme")),
              "programmes",
          )
          PY

      - name: Commit SHASHA Guide EPG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add shasha_guide_epg.xml

          if git diff --cached --quiet; then
            echo "No SHASHA Guide EPG changes to commit."
            exit 0
          fi

          git commit -m "Update SHASHA Guide EPG"
          git pull --rebase origin main
          git push origin main
