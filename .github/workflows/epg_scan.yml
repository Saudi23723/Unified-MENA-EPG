name: EPG source scan (temporary)
on:
  push:
    branches: [epg-scan]
    paths: [scan_sources.py, .github/workflows/epg_scan.yml]
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python3 scan_sources.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scan && git commit -m "scan results" && git push origin HEAD:epg-scan
