name: Merge Unified MENA EPG

on:
  workflow_dispatch:

  # The real trigger. Every guide is committed by a workflow using
  # GITHUB_TOKEN, and GitHub deliberately does not let a GITHUB_TOKEN push
  # start another workflow — so the push trigger below never fires for
  # them and the merge used to depend on the schedule alone. When GitHub
  # drops scheduled runs under load, as it did for over an hour on
  # 26 August, the merged link silently falls behind its own sources.
  #
  # workflow_run is not subject to that rule: it fires when the named
  # workflow finishes, whoever started it. The merge now follows its
  # sources instead of guessing when they ran.
  workflow_run:
    workflows:
      - "Update Alkass EPG"
      - "Update Alwan Sports EPG"
      - "Update Fajer Sports EPG"
      - "Update Jordan (Roya) EPG"
      - "Update Jordan Sports EPG"
      - "Update ON Sport EPG"
      - "Update STARZPLAY Sports EPG"
      - "Update Shahid Sports EPG"
      - "Update Shasha EPG"
      - "Update Tabii Spor EPG"
      - "Update Thamanya EPG"
      - "Update Thmanyah + Alwan EPG"
      - "Update Tivibu Spor EPG"
      - "Update beIN Sports Qatar EPG"
      - "Update beIN Sports Türkiye EPG"
    types: [completed]

  # Kept as a safety net, not as the mechanism.
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches:
      - main
    paths:
      - "merge_epg.py"
      - "epg_lib.py"
      - "*.xml"
      - ".github/workflows/update_unified_epg.yml"

permissions:
  contents: write

concurrency:
  group: unified-mena-epg
  cancel-in-progress: false

jobs:
  merge:
    # A failed source wrote nothing, so there is nothing new to merge.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Merge all EPG sources
        run: python merge_epg.py

      - name: Validate XMLTV
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse("unified_mena_epg.xml").getroot()
          assert root.tag == "tv"
          assert root.find("channel") is not None
          print("UNIFIED MENA EPG XMLTV VALIDATION PASS")
          PY

      - name: Commit merged EPG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add unified_mena_epg.xml

          if git diff --cached --quiet; then
            echo "No unified EPG changes to commit."
            exit 0
          fi

          git commit -m "Merge unified MENA EPG"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin main; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push rejected (another workflow pushed first), retrying ($attempt/5)..."
            sleep $(( (RANDOM % 5) + 2 ))
          done
          echo "Failed to push after 5 attempts"
          exit 1
