name: Probe — tafsir and hadith sources
on:
  push:
    paths:
      - "probes/probe_tafsir_hadith.py"
      - ".github/workflows/probe_tafsir_hadith.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: What each candidate actually carries
        run: python -u probes/probe_tafsir_hadith.py
