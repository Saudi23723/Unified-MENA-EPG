name: Probe — azkar sources
on:
  push:
    paths:
      - "probes/probe_azkar.py"
      - ".github/workflows/probe_azkar.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: What each azkar source actually carries
        run: python -u probes/probe_azkar.py
