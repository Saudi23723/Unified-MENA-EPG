name: Verify tabii standing notice

# Research only, and deliberately not on main. The sources answer only
# from inside the countries they serve. Read-only, commits nothing,
# deleted once the checks pass.
on:
  push:
    paths:
      - "tools/verify_tabii_standin.py"
      - "update_tabii_epg.py"
      - ".github/workflows/verify_tabii_standin.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python tools/verify_tabii_standin.py
