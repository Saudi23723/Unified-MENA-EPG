name: Screensaver matches (small file for the TV)

# screensaver_matches.py: today's matches, a few KB, cut from today_matches_epg.xml.
on:
  schedule:
    - cron: "52 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [screensaver_matches.py, .github/workflows/update_screensaver_matches.yml]

permissions:
  contents: write

concurrency:
  group: screensaver-matches
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python screensaver_matches.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screensaver_matches.json
          git diff --cached --quiet && { echo "No changes."; exit 0; }
          git commit -m "Update screensaver matches"
          for attempt in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push origin main && exit 0
            sleep $(( (RANDOM % 5) + 2 ))
          done
          exit 1
