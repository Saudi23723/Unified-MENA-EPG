# Ask sportsmediawatch, boxingscene and mmatown what they publish — and
# ask livesoccertv, which is already wired, what it names today.
# It commits nothing and publishes nothing.
name: Probe the sources named by the reader

on:
  workflow_dispatch:
  push:
    branches: [claude/arabic-channels-epg-99099k]
    paths:
      - "probes/probe_more_sources.py"
      - ".github/workflows/probe_more_sources.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -u probes/probe_more_sources.py
