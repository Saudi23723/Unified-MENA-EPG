name: Verify the three rebuilt guides (branch only)
on:
  push:
    branches: [claude/arabic-channels-epg-99099k]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -u update_tabii_epg.py
      - run: python -u bein_sports_turkey_epg.py 2>&1 | tail -20
      - run: python -u roya_jordan_epg.py 2>&1 | tail -6
      - name: Inspect all three
        run: |
          python -u - <<'PY'
          import xml.etree.ElementTree as ET
          from collections import defaultdict
          from datetime import datetime, timezone
          now = datetime.now(timezone.utc)
          BADGES = "\U0001F535\U0001F7E2\U0001F7E3"
          for path in ("tabii_spor_1_10_epg.xml", "bein_sports_turkey_epg.xml",
                       "roya_jordan_epg.xml"):
              root = ET.parse(path).getroot()
              per, badged, future = defaultdict(int), [], 0
              for p in root.findall("programme"):
                  per[p.get("channel")] += 1
                  t = p.find("title").text or ""
                  if any(b in t for b in BADGES):
                      badged.append((p.get("channel"), p.get("start"), t))
                  s = datetime.strptime(p.get("start"), "%Y%m%d%H%M%S %z")
                  e = datetime.strptime(p.get("stop"), "%Y%m%d%H%M%S %z")
                  assert e > s, f"bad duration in {path}"
                  if s > now:
                      future += 1
              days = sorted({p.get("start")[:8] for p in root.findall("programme")})
              print(f"\n### {path}: {len(root.findall('channel'))} channels, "
                    f"{sum(per.values())} programmes, {future} still ahead, "
                    f"{len(days)} days ({days[0]}..{days[-1]})")
              for c in root.findall("channel"):
                  xid = c.get("id")
                  icon = c.find("icon")
                  print(f"   {xid:22} {per[xid]:4} prog  "
                        f"icon={'yes' if icon is not None else 'NO'}")
              print(f"   badged live: {len(badged)}")
              for c, s, t in badged[:8]:
                  print(f"     {c} {s[:12]} {t[:60]}")
          PY
