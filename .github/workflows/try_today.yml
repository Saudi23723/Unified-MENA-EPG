name: Try the today-matches guide
on:
  push:
    paths:
      - "today_matches_epg.py"
      - ".github/workflows/try_today.yml"
permissions:
  contents: read
jobs:
  try:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -u today_matches_epg.py
      - name: Read the strip back
        run: |
          python -u - <<'PY'
          import re, xml.etree.ElementTree as ET
          from datetime import datetime, timezone
          root = ET.parse("today_matches_epg.xml").getroot()
          rows = sorted(root.iter("programme"), key=lambda p: p.get("start"))
          print(f"\n{len(rows)} rows on one channel\n")
          for p in rows[:22]:
              t = re.sub(r"[⁦-⁩‎‏]", "", p.findtext("title") or "")
              print(f"  {p.get('start')[8:12]}-{p.get('stop')[8:12]}  {t[:96]}")
          desc = (rows[0].findtext("desc") or "").splitlines()
          print("\n-- the description a viewer opens --")
          for line in desc[:16]:
              print(f"  {line}")
          PY
