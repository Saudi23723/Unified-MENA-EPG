name: Try the today-matches guide
on:
  push:
    paths:
      - "today_matches_epg.py"
      - "tivibu_spor_epg.py"
      - ".github/workflows/try_today.yml"
permissions:
  contents: read
jobs:
  try:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -u today_matches_epg.py
      - run: python -u bein_sports_turkey_epg.py
      - name: One file owns the id, and the strip reads right
        run: |
          python -u - <<'PY'
          import re, xml.etree.ElementTree as ET
          owners = {}
          for f in ("today_matches_epg.xml", "bein_sports_turkey_epg.xml"):
              for c in ET.parse(f).getroot().findall("channel"):
                  owners.setdefault(c.get("id"), []).append(f)
          clash = {k: v for k, v in owners.items() if len(v) > 1}
          print("channels claimed by two files:", clash or "none")
          root = ET.parse("today_matches_epg.xml").getroot()
          for c in root.findall("channel"):
              print("today's guide publishes under:", c.get("id"),
                    "/", c.findtext("display-name"))
          rows = sorted(root.iter("programme"), key=lambda p: p.get("start"))
          print(f"\n{len(rows)} rows\n")
          for p in rows[:14]:
              t = re.sub(r"[⁦-⁩‎‏]", "", p.findtext("title") or "")
              print(f"  {p.get('start')[8:12]}-{p.get('stop')[8:12]}  {t[:92]}")
          assert not clash, "two files claim the same channel id"
          PY
