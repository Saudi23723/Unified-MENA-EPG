name: Build Private Vault APK

# Builds the Android app in PrivateVault/ and publishes the APK as a
# release, so it can be downloaded straight to the phone.

on:
  push:
    paths:
      - 'PrivateVault/**'
      - '!PrivateVault/laptop/**'
      - '.github/workflows/build_private_vault.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: private-vault-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: PrivateVault
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Every build must be signed with the same key, or Android refuses to
      # install it over the previous one. The key comes from the
      # VAULT_KEYSTORE_BASE64 secret when set; otherwise one is made on the
      # first build and kept in the Actions cache for the builds after it.
      - name: Keep signing key
        uses: actions/cache@v4
        with:
          path: ~/vault-signing
          key: private-vault-signing-v1

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.VAULT_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.VAULT_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/vault.jks"
            echo "VAULT_KEYSTORE=$RUNNER_TEMP/vault.jks" >> "$GITHUB_ENV"
            echo "::add-mask::$KEYSTORE_PASSWORD"
            echo "VAULT_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          else
            mkdir -p ~/vault-signing
            if [ ! -f ~/vault-signing/vault.jks ]; then
              echo "::warning::No cached signing key; making a new one. Uninstall older builds once before installing this one."
              keytool -genkeypair -keystore ~/vault-signing/vault.jks -storepass vaultcache \
                -alias vault -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=Private Vault"
            fi
            echo "VAULT_KEYSTORE=$HOME/vault-signing/vault.jks" >> "$GITHUB_ENV"
            echo "VAULT_KEYSTORE_PASSWORD=vaultcache" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk PrivateVault.apk

      # The app updates itself from this branch (see Updater.kt).
      - name: Publish for one-tap updates
        run: |
          dir="$RUNNER_TEMP/updates"
          mkdir -p "$dir" && cp PrivateVault.apk "$dir/"
          echo "{\"versionCode\": $((100 + ${{ github.run_number }})), \"versionName\": \"1.${{ github.run_number }}\", \"apk\": \"PrivateVault.apk\"}" > "$dir/latest.json"
          cd "$dir"
          git init -q -b vault-builds-android
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Private Vault build ${{ github.run_number }}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" HEAD:vault-builds-android
          curl -sS "https://purge.jsdelivr.net/gh/${{ github.repository }}@vault-builds-android/latest.json" > /dev/null || true
          curl -sS "https://purge.jsdelivr.net/gh/${{ github.repository }}@vault-builds-android/PrivateVault.apk" > /dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: PrivateVault-apk
          path: PrivateVault/PrivateVault.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: private-vault-${{ github.run_number }}
          name: خزنتي - Private Vault (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          body: |
            حمّل ملف PrivateVault.apk على هاتفك وثبّته.
            التحديثات الجديدة تُثبَّت فوق القديمة وتبقى ملفاتك محفوظة.
          files: PrivateVault/PrivateVault.apk
