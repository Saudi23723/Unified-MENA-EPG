name: Build Private Vault APK

# Builds the Android app in PrivateVault/ and publishes the APK as a
# release, so it can be downloaded straight to the phone.

on:
  push:
    paths:
      - 'PrivateVault/**'
      - '.github/workflows/build_private_vault.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: private-vault-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: PrivateVault
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Without the secret, keep the runner's debug key between builds so
      # updates still install over the previous APK.
      - name: Keep debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: private-vault-debug-keystore

      - name: Signing key from secrets
        env:
          KEYSTORE_B64: ${{ secrets.VAULT_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/vault.jks"
            echo "VAULT_KEYSTORE=$RUNNER_TEMP/vault.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::VAULT_KEYSTORE_BASE64 secret not set; signing with the cached debug key."
          fi

      - name: Build APK
        env:
          VAULT_KEYSTORE_PASSWORD: ${{ secrets.VAULT_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk PrivateVault.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PrivateVault-apk
          path: PrivateVault/PrivateVault.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: private-vault-${{ github.run_number }}
          name: خزنتي - Private Vault (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          body: |
            حمّل ملف PrivateVault.apk على هاتفك وثبّته.
            التحديثات الجديدة تُثبَّت فوق القديمة وتبقى ملفاتك محفوظة.
          files: PrivateVault/PrivateVault.apk
