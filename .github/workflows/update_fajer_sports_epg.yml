name: Update Fajer Sports EPG

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: update-fajer-sports-epg
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OCR and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ara
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pillow pytesseract

      - name: Update Fajer Sports EPG
        run: python update_fajer_sports_epg.py

      - name: Validate XMLTV
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse("fajer_sports_epg.xml").getroot()

          assert root.tag == "tv"

          channels = root.findall("channel")
          programmes = root.findall("programme")

          assert len(channels) == 5, \
              f"Expected 5 channels, got {len(channels)}"

          print(
              f"XMLTV PASS | "
              f"channels={len(channels)} | "
              f"programmes={len(programmes)}"
          )
          PY

      - name: Commit updated EPG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add fajer_sports_epg.xml

          if git diff --cached --quiet; then
            echo "No Fajer EPG changes to commit."
            exit 0
          fi

          git commit -m "Update Fajer Sports EPG"
          git pull --rebase origin main
          git push origin main
