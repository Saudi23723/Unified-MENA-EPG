name: Apply channel 2 sources
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the updated sources
        run: |
          curl -fsSL -o mlb_espn.py https://h.uguu.se/qrbZyxYE.py
          curl -fsSL -o boxing_promotions.py https://n.uguu.se/scwYZNjW.py
          curl -fsSL -o world_sport_on_tv.py https://h.uguu.se/sbwsNQQt.py
          curl -fsSL -o other_sports_epg.py https://d.uguu.se/UxVEpVfx.py
          for f in mlb_espn.py boxing_promotions.py world_sport_on_tv.py other_sports_epg.py; do
            python -c "import ast,sys;ast.parse(open(sys.argv[1],encoding='utf-8').read())" "$f"
          done
      - name: Commit
        run: |
          git config user.name "epg-bot"
          git config user.email "epg-bot@users.noreply.github.com"
          git add -A mlb_espn.py boxing_promotions.py world_sport_on_tv.py other_sports_epg.py
          git commit -m "Channel 2: MLB and the World Series, the promotions own boxing cards, the Olympics" || echo "nothing to commit"
          for i in 1 2 3 4 5 6 7 8; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort; git reset --hard HEAD; }
            if git push origin HEAD:main; then echo pushed; exit 0; fi
            sleep 25
          done
          echo "could not push"; exit 1
