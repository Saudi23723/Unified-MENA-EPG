name: Probe — women's volleyball and men's handball
on:
  push:
    paths:
      - "probes/probe_volleyball_and_handball.py"
      - "probes/probe_turkish_volleyball.py"
      - "probes/probe_event_list_rows.py"
      - "probes/probe_a_match_day.py"
      - ".github/workflows/probe_vb_hb.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -u probes/probe_a_match_day.py
