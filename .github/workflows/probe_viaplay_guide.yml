name: Probe — Viaplay DK guide
on:
  push:
    paths:
      - "probes/probe_viaplay_guide.py"
      - ".github/workflows/probe_viaplay_guide.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -u probes/probe_viaplay_guide.py
