name: Apply screen update
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch updated screen scripts
        run: |
          curl -fsSL -o match_board.py https://litter.catbox.moe/kcsnai.py
          curl -fsSL -o team_badges.py https://d.uguu.se/FcSJrNJR.py
          curl -fsSL -o today_matches_epg.py https://n.uguu.se/snQPfTuc.py
          python -c "import ast,sys;[ast.parse(open(f,encoding='utf-8').read()) for f in ['match_board.py','team_badges.py','today_matches_epg.py']]"
      - name: Commit
        run: |
          git config user.name "epg-bot"
          git config user.email "epg-bot@users.noreply.github.com"
          git add match_board.py team_badges.py today_matches_epg.py
          git commit -m "Screens: real crests, event rows on channel 2, no repeated fixtures" || echo "nothing to commit"
          git push
