name: Probe the American channels
on:
  workflow_dispatch:
  push:
    paths: ['tools/probe_us.py', '.github/workflows/probe_us.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - run: python -u tools/probe_us.py
        env: {PYTHONPATH: .}
