name: Probe candidate sources
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/probe_sources.py'
      - '.github/workflows/probe_sources.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -u tools/probe_sources.py
        env:
          PYTHONPATH: .
