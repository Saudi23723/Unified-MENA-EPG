name: Probe — who publishes the other sports with a channel
on:
  push:
    paths:
      - "tools/probe_other_sports.py"
      - ".github/workflows/probe_board2.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -u tools/probe_other_sports.py
