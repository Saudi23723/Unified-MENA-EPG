name: Argon EPG (DreamTV names)

# Re-publishes unified_mena_epg.xml under the Argon playlist's channel names (argon_epg.py).
# Its own schedule: commits made by the main build's GITHUB_TOKEN do not start other workflows.
on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [xtream_epg.py, xtream_order.py, official_fill.py, "xtream/*/channel_map.json", "xtream/*/group_order.json", .github/workflows/update_argon_epg.yml]

permissions:
  contents: write

concurrency:
  group: argon-epg
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build argon_epg.xml and hydra_epg.xml
        run: python argon_epg.py
      - name: Copy this repository's AT&T guide in (att-epg branch)
        run: |
          git fetch -q --depth 1 origin att-epg && git show FETCH_HEAD:att_epg.xml.gz > att_epg.xml.gz || rm -f att_epg.xml.gz
      - name: Build Xtream data for the DreamTV relays (xtream/ and _data/)
        run: python xtream_epg.py
      - name: Validate XMLTV
        run: python -c "import xml.etree.ElementTree as E; [E.parse(f) for f in ('argon_epg.xml','hydra_epg.xml')]; print('VALID')"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # guide files change every run: publish them on their own branch with no history
          ( cd _data && git init -q -b xtream-data && git add -A \
            && git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Xtream guide data" \
            && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" xtream-data )
          git add argon_epg.xml hydra_epg.xml xtream
          git diff --cached --quiet && { echo "No changes."; exit 0; }
          git commit -m "Update Argon EPG"
          for attempt in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push origin main && exit 0
            sleep $(( (RANDOM % 5) + 2 ))
          done
          exit 1
