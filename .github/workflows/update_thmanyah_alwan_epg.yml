name: Update Thmanyah + Alwan EPG

on:
  workflow_dispatch:

  schedule:
    - cron: "15 3 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Build Thmanyah + Alwan XMLTV
        run: |
          python update_thmanyah_alwan_epg.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add thmanyah_epg.xml alwan_sports_epg.xml
          git diff --cached --quiet || git commit -m "Update Thmanyah and Alwan EPG"
          git push
