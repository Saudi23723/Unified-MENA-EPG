name: Test the web player in Safari's engine

# Manual (owner, 25 Nov 2026: "check yourself that it works, a customer is using it"). Plays live channels on the
# real /tv page in WebKit as an iPhone and checks the picture moves. A device code for the test comes from a
# throw-away worker that reads it from the database and is deleted at once; the code is masked in the log.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safari:
    runs-on: macos-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ACC: 6ebea2f90132db027f0713f5ca1ffa01
    steps:
      - uses: actions/checkout@v4
      - name: A device code for the test
        run: |
          API=https://api.cloudflare.com/client/v4/accounts/$ACC/workers/scripts
          DB=$(curl -sS "$API/saudi1/settings" -H "Authorization: Bearer $CF_TOKEN" | python3 -c 'import json,sys; print([b for b in json.load(sys.stdin)["result"]["bindings"] if b["type"]=="d1"][0]["id"])')
          KEY=$(python3 -c 'import secrets; print(secrets.token_hex(16))'); echo "::add-mask::$KEY"
          META=$(python3 -c 'import json,sys; print(json.dumps({"main_module":"worker.js","compatibility_date":"2024-09-01","bindings":[{"type":"d1","name":"DB","id":sys.argv[1]},{"type":"secret_text","name":"KEY","text":sys.argv[2]}]}))' "$DB" "$KEY")
          curl -sS -o up.json -w "upload %{http_code}\n" -X PUT "$API/saudi1-pick" -H "Authorization: Bearer $CF_TOKEN" \
            -F "metadata=$META;type=application/json" -F 'worker.js=@tools/e2e/pick.js;type=application/javascript+module;filename=worker.js'
          python3 -c 'import json; r=json.load(open("up.json")); print("ok" if r.get("success") else r.get("errors"))'
          curl -sS -o /dev/null -w "subdomain %{http_code}\n" -X POST "$API/saudi1-pick/subdomain" -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" --data '{"enabled":true,"previews_enabled":false}'
          for i in $(seq 1 24); do C=$(curl -s -H "x-key: $KEY" https://saudi1-pick.1saifsaudi.workers.dev/); [ ${#C} = 8 ] && break; sleep 5; done
          curl -sS -o /dev/null -w "throw-away worker deleted %{http_code}\n" -X DELETE "$API/saudi1-pick?force=true" -H "Authorization: Bearer $CF_TOKEN"
          [ ${#C} = 8 ] || { echo "no working device found"; exit 1; }
          echo "::add-mask::$C"; echo "CODE=$C" >> "$GITHUB_ENV"; echo "device code found"
      - name: Remove the throw-away worker (if still there)
        if: always()
        run: curl -sS -o /dev/null -w "%{http_code}\n" -X DELETE "https://api.cloudflare.com/client/v4/accounts/$ACC/workers/scripts/saudi1-pick?force=true" -H "Authorization: Bearer $CF_TOKEN"
      - name: Play channels in WebKit (iPhone)
        run: |
          cd tools/e2e
          npm init -y >/dev/null && npm i playwright@1.49.1 >/dev/null 2>&1 && npx playwright install webkit >/dev/null 2>&1
          node web_test.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots
          path: tools/e2e/shot_*.png
          retention-days: 1
