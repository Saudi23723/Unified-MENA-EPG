# Ask SPORT TV Portugal where its schedule is and what is in a row.
# It commits nothing and publishes nothing.
name: Probe Sport TV Portugal

on:
  workflow_dispatch:
  push:
    branches: [claude/arabic-channels-epg-99099k]
    paths:
      - "probes/probe_sporttv_pt.py"
      - "probes/probe_sporttv_rows.py"
      - "probes/probe_sporttv_channel.py"
      - "probes/probe_sporttv_epg.py"
      - "probes/probe_sporttv_resolve.py"
      - "probes/probe_sporttv_reader.py"
      - "sporttv_pt.py"
      - ".github/workflows/probe_sporttv_pt.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -u probes/probe_sporttv_pt.py
      - run: python -u probes/probe_sporttv_rows.py
      - run: python -u probes/probe_sporttv_channel.py
      - run: python -u probes/probe_sporttv_epg.py
      - run: python -u probes/probe_sporttv_resolve.py
      - run: python -u probes/probe_sporttv_reader.py
