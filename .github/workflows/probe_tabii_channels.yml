name: Probe tabii channels

on:
  workflow_dispatch:
  push:
    branches:
      - claude/arabic-channels-epg-99099k
    paths:
      - ".github/workflows/probe_tabii_channels.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests

      - name: Probe
        run: |
          python -u - <<'PY'
          import json, re
          import requests

          UA = ("Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/126.0 Safari/537.36")
          S = requests.Session()
          S.headers.update({"User-Agent": UA, "Accept-Language": "tr,en;q=0.8"})
          LD = re.compile(r'<script[^>]+application/ld\+json[^>]*>(.*?)</script>', re.S)

          def get(url, **kw):
              try:
                  r = S.get(url, timeout=20, **kw)
                  return r.status_code, r.text
              except Exception as exc:
                  return None, f"ERROR {exc}"

          def span(page):
              days = set()
              for blob in LD.findall(page or ""):
                  try:
                      arr = json.loads(blob)
                  except Exception:
                      continue
                  for e in (arr if isinstance(arr, list) else [arr]):
                      s = ((e.get("broadcastOfEvent") or {}) or {}).get("startDate")
                      if s:
                          days.add(s[:10])
              return sorted(days)

          print("#" * 72)
          print("A) what dates each URL actually renders")
          print("#" * 72)
          for url in ["https://www.sporekrani.com/",
                      "https://www.sporekrani.com/home/day/2026-08-26",
                      "https://www.sporekrani.com/home/day/2026-08-27",
                      "https://www.sporekrani.com/home/day/2026-08-30"]:
              c, p = get(url)
              print(f"   HTTP {c} dates={span(p)}  {url}")

          print()
          print("#" * 72)
          print("B) the JS bundle — what endpoints the day switcher calls")
          print("#" * 72)
          c, home = get("https://www.sporekrani.com/")
          js = sorted(set(re.findall(r'src="(/[^"]+\.js)"', home or "")))
          print("   scripts:", js[:20])
          seen = set()
          for path in js[:25]:
              sc, body = get("https://www.sporekrani.com" + path)
              if sc != 200:
                  continue
              seen |= set(re.findall(r'["\'`](/(?:api|v\d|home|ajax)[a-zA-Z0-9\-_/\$\{\}\.]{2,60})["\'`]', body))
          for p in sorted(seen)[:60]:
              print("     ", p)

          print()
          print("#" * 72)
          print("C) try the obvious data routes with a date")
          print("#" * 72)
          for path in ["/api/v1/events?date=2026-08-27",
                       "/api/event/day/2026-08-27",
                       "/home/day/2026-08-27/",
                       "/gunun-maclari/2026-08-27",
                       "/yayin-akisi/2026-08-27"]:
              sc, body = get("https://www.sporekrani.com" + path,
                             headers={"X-Requested-With": "XMLHttpRequest",
                                      "Accept": "application/json"})
              d = span(body)
              snippet = re.sub(r"\s+", " ", (body or ""))[:90]
              print(f"   HTTP {str(sc):<5} dates={d} {path}")
              if sc == 200 and not d:
                  print("        ", snippet)
          PY
