name: Probe tabii channels

on:
  workflow_dispatch:
  push:
    branches:
      - claude/arabic-channels-epg-99099k
    paths:
      - ".github/workflows/probe_tabii_channels.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests

      - name: Probe
        run: |
          python -u - <<'PY'
          import json, re
          import requests

          UA = ("Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/126.0 Safari/537.36")
          S = requests.Session()
          S.headers.update({"User-Agent": UA, "Accept-Language": "tr,en;q=0.8"})

          def get(url):
              try:
                  r = S.get(url, timeout=20)
                  return r.status_code, r.text
              except Exception as exc:
                  return None, f"ERROR {exc}"

          STATE = re.compile(r'window\.__INITIAL_STATE__=(\{.*?\});?\s*</script>', re.S)

          def state_of(page):
              m = STATE.search(page or "")
              if not m:
                  return None
              raw = m.group(1)
              try:
                  return json.loads(raw)
              except Exception as exc:
                  print("     state not JSON:", exc, "| head:", raw[:120])
                  return None

          def find_events(node, depth=0, out=None):
              """Lists of dicts that look like broadcast rows."""
              out = [] if out is None else out
              if depth > 12:
                  return out
              if isinstance(node, dict):
                  for v in node.values():
                      find_events(v, depth + 1, out)
              elif isinstance(node, list):
                  if node and isinstance(node[0], dict) and any(
                          k in node[0] for k in ("channels", "channel", "start_at", "starts_at", "date")):
                      out.append(node)
                  for v in node[:200]:
                      find_events(v, depth + 1, out)
              return out

          print("#" * 72)
          print("A) shape of one day page")
          print("#" * 72)
          code, page = get("https://www.sporekrani.com/home/day/2026-08-26")
          print("HTTP", code, "| bytes", len(page))
          st = state_of(page)
          print("has __INITIAL_STATE__:", st is not None)
          if st:
              print("top-level keys:", list(st.keys()))
              lists = find_events(st)
              print("candidate event lists:", [len(l) for l in lists][:10])
              if lists:
                  biggest = max(lists, key=len)
                  print("biggest list length:", len(biggest))
                  print("SAMPLE ROW (pretty):")
                  print(json.dumps(biggest[0], ensure_ascii=False, indent=2)[:1800])
                  print()
                  print("ROWS MENTIONING tabii:")
                  n = 0
                  for row in biggest:
                      blob = json.dumps(row, ensure_ascii=False)
                      if re.search(r'tabii', blob, re.I):
                          print("  ", json.dumps(row, ensure_ascii=False)[:520])
                          n += 1
                          if n >= 6:
                              break
                  print("   total tabii rows on this day:", sum(
                      1 for r in biggest if re.search(r'tabii', json.dumps(r, ensure_ascii=False), re.I)))

          print()
          print("#" * 72)
          print("B) ld+json BroadcastEvent — the simpler read")
          print("#" * 72)
          for blob in re.findall(r'<script[^>]+application/ld\+json[^>]*>(.*?)</script>', page, re.S):
              try:
                  arr = json.loads(blob)
              except Exception:
                  continue
              arr = arr if isinstance(arr, list) else [arr]
              tab = [e for e in arr if re.search(r'tabii', json.dumps(e, ensure_ascii=False), re.I)]
              print(f"   {len(arr)} events, {len(tab)} mention tabii")
              for e in tab[:5]:
                  print("     ", json.dumps(e, ensure_ascii=False)[:600])

          print()
          print("#" * 72)
          print("C) how many days forward exist, and do 8/9/10 ever appear")
          print("#" * 72)
          import datetime as dt
          today = dt.date(2026, 8, 25)
          allnames = {}
          for i in range(-1, 9):
              d = today + dt.timedelta(days=i)
              c, p = get(f"https://www.sporekrani.com/home/day/{d}")
              names = {}
              for m in re.findall(r'tabii\s?Spor\s?\d{0,2}', p or "", re.I):
                  k = re.sub(r"\s+", " ", m.strip())
                  names[k] = names.get(k, 0) + 1
                  allnames[k] = allnames.get(k, 0) + 1
              print(f"   {d} HTTP {c} bytes {len(p):>7} | {sorted(names)}")
          print("   union across all days:", sorted(allnames))
          PY
