name: Probe tabii channels

on:
  workflow_dispatch:
  push:
    branches:
      - claude/arabic-channels-epg-99099k
    paths:
      - ".github/workflows/probe_tabii_channels.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests beautifulsoup4

      - name: Probe
        run: |
          python -u - <<'PY'
          import json, re
          import requests
          from bs4 import BeautifulSoup

          UA = ("Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/126.0 Safari/537.36")
          S = requests.Session()
          S.headers.update({"User-Agent": UA, "Accept-Language": "tr,en;q=0.8"})

          def get(url, **kw):
              try:
                  r = S.get(url, timeout=20, **kw)
                  return r.status_code, r.text
              except Exception as exc:
                  return None, f"ERROR {exc}"

          code, page = get("https://www.sporekrani.com/")
          print("sporekrani HTTP", code, "| bytes", len(page))
          soup = BeautifulSoup(page, "html.parser")

          print()
          print("#" * 72)
          print("A) every tabii Spor name on the page, with counts")
          print("#" * 72)
          names = {}
          for m in re.findall(r'[Tt]abii\s?[Ss]por\s?\d{0,2}', page):
              k = m.strip()
              names[k] = names.get(k, 0) + 1
          for k in sorted(names, key=lambda s: (len(s), s)):
              print(f"   {k!r:22} x{names[k]}")

          print()
          print("#" * 72)
          print("B) structured data on the page")
          print("#" * 72)
          ld = re.findall(r'<script[^>]+application/ld\+json[^>]*>(.*?)</script>', page, re.S)
          print("   ld+json blocks:", len(ld))
          for b in ld[:3]:
              print("     ", re.sub(r"\s+", " ", b)[:200])
          print("   schema.org/Event blocks:", len(re.findall(r'schema\.org/(?:Broadcast)?Event', page)))
          print("   __NEXT_DATA__:", "yes" if "__NEXT_DATA__" in page else "no")

          print()
          print("#" * 72)
          print("C) the markup around a numbered tabii channel")
          print("#" * 72)
          shown = 0
          for node in soup.find_all(string=re.compile(r'tabii\s?Spor\s?\d', re.I)):
              row = node
              for _ in range(5):
                  if row.parent is None:
                      break
                  row = row.parent
                  txt = re.sub(r"\s+", " ", row.get_text(" ", strip=True))
                  if len(txt) > 40:
                      break
              print(f"   --- match {shown + 1} ---")
              print("   tag chain:", " < ".join(
                  p.name for p in list(node.parents)[:5] if p.name))
              print("   classes:", [p.get("class") for p in list(node.parents)[:4] if hasattr(p, "get")])
              print("   text:", re.sub(r"\s+", " ", row.get_text(" ", strip=True))[:220])
              print("   html:", re.sub(r"\s+", " ", str(row))[:400])
              shown += 1
              if shown >= 4:
                  break
          if not shown:
              print("   none found via soup — the numbers may be inside an attribute")
              for m in re.finditer(r'[Tt]abii\s?[Ss]por\s?\d', page):
                  a, b = max(0, m.start() - 300), m.end() + 300
                  print("   ...", re.sub(r"\s+", " ", page[a:b]))
                  break

          print()
          print("#" * 72)
          print("D) does it have day pages / other sections")
          print("#" * 72)
          links = sorted(set(re.findall(r'href="(/[a-z0-9\-/]*)"', page)))
          print("   internal links:", len(links))
          for l in links[:40]:
              print("     ", l)
          PY
