name: Probe tabii channels

on:
  workflow_dispatch:
  push:
    branches:
      - claude/arabic-channels-epg-99099k
    paths:
      - ".github/workflows/probe_tabii_channels.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests

      - name: Probe
        run: |
          python -u - <<'PY'
          import json, re
          import requests

          UA = ("Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/126.0 Safari/537.36")
          S = requests.Session()
          S.headers.update({"User-Agent": UA, "Accept-Language": "tr,en;q=0.8"})
          LD = re.compile(r'<script[^>]+application/ld\+json[^>]*>(.*?)</script>', re.S)

          def get(url):
              try:
                  r = S.get(url, timeout=20)
                  return r.status_code, r.text
              except Exception as exc:
                  return None, f"ERROR {exc}"

          def events_of(page):
              out = []
              for blob in LD.findall(page or ""):
                  try:
                      arr = json.loads(blob)
                  except Exception:
                      continue
                  out += arr if isinstance(arr, list) else [arr]
              return out

          def channels_of(ev):
              """Every channel name this event names, however it names them."""
              names = set()
              pub = ev.get("publishedOn")
              for p in (pub if isinstance(pub, list) else [pub] if pub else []):
                  if isinstance(p, dict) and p.get("name"):
                      names.add(p["name"].strip())
              if not names:
                  d = ev.get("description") or ""
                  m = re.search(r'(.+?)\s+kanal\(lar\)ından', d)
                  if m:
                      names.add(m.group(1).strip().split("  ")[-1])
              return names

          def when(ev):
              b = ev.get("broadcastOfEvent") or {}
              return b.get("startDate"), b.get("endDate"), (b.get("name") or ev.get("name") or "").strip()

          print("#" * 72)
          print("A) per-channel pages: which numbers exist, how much each carries")
          print("#" * 72)
          slugs = ["tabii-spor"] + [f"tabii-spor-{n}" for n in range(1, 13)]
          for slug in slugs:
              code, page = get(f"https://www.sporekrani.com/home/channel/{slug}")
              evs = events_of(page)
              mine = [e for e in evs if any("tabii" in c.lower() for c in channels_of(e))]
              dates = sorted({(when(e)[0] or "")[:10] for e in mine if when(e)[0]})
              print(f"   {slug:<16} HTTP {code} | bytes {len(page):>8} | ld events {len(evs):>3} "
                    f"| tabii {len(mine):>3} | days {dates}")

          print()
          print("#" * 72)
          print("B) the homepage feed: full date span and per-number breakdown")
          print("#" * 72)
          code, page = get("https://www.sporekrani.com/")
          evs = events_of(page)
          print(f"   homepage HTTP {code} | {len(evs)} events")
          per = {}
          span = []
          for e in evs:
              s, t, name = when(e)
              if s:
                  span.append(s)
              for c in channels_of(e):
                  if "tabii" in c.lower():
                      per.setdefault(c, []).append((s, t, name, bool(e.get("isLiveBroadcast"))))
          print(f"   overall date span: {min(span)[:16] if span else '-'} .. {max(span)[:16] if span else '-'}")
          for c in sorted(per):
              rows = sorted(per[c])
              print(f"   --- {c} ({len(rows)}) ---")
              for s, t, name, live in rows:
                  print(f"        {(s or '')[:16]} -> {(t or '')[:16]}  live={live}  {name}")

          print()
          print("#" * 72)
          print("C) does the site expose a JSON API the page calls")
          print("#" * 72)
          for path in ["/api/events", "/api/home", "/api/channels",
                       "/home/day/2026-08-27?format=json"]:
              c, b = get("https://www.sporekrani.com" + path)
              print(f"   HTTP {str(c):<5} {path:<36} {re.sub(chr(92)+'s+', ' ', (b or ''))[:100]}")
          PY
