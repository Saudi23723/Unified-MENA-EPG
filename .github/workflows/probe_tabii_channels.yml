name: Probe tabii channels

on:
  workflow_dispatch:
  push:
    branches:
      - claude/arabic-channels-epg-99099k
    paths:
      - ".github/workflows/probe_tabii_channels.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests

      - name: Probe
        run: |
          python -u - <<'PY'
          import json, re
          import requests

          UA = ("Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/126.0 Safari/537.36")
          S = requests.Session()
          S.headers.update({
              "User-Agent": UA,
              "Accept": ("text/html,application/xhtml+xml,application/xml;q=0.9,"
                         "image/avif,image/webp,*/*;q=0.8"),
              "Accept-Language": "tr,en-US;q=0.9,en;q=0.8",
          })

          def get(url, **kw):
              try:
                  r = S.get(url, timeout=20, **kw)
                  return r.status_code, r.text
              except Exception as exc:
                  return None, f"ERROR {exc}"

          print("#" * 72)
          print("A) tabii's own JS bundle — what apigateway endpoints exist")
          print("#" * 72)
          code, home = get("https://www.tabii.com/tr")
          print("home HTTP", code, "bytes", len(home))
          chunks = sorted(set(re.findall(r'/_next/static/[A-Za-z0-9_\-/\.]+\.js', home or "")))
          print("chunks referenced by the page:", len(chunks))
          paths, names = set(), set()
          for c in chunks[:40]:
              sc, js = get("https://www.tabii.com" + c)
              if sc != 200:
                  continue
              paths |= set(re.findall(r'apigateway/([A-Za-z0-9\-_/\{\}\.]{3,60})', js))
              names |= set(re.findall(r'"(/[a-z0-9\-]+/v\d[A-Za-z0-9\-/_]{0,40})"', js))
          print(f"apigateway paths found ({len(paths)}):")
          for p in sorted(paths)[:60]:
              print("   apigateway/" + p)
          print(f"versioned service paths ({len(names)}):")
          for p in sorted(names)[:40]:
              print("  ", p)

          print()
          print("#" * 72)
          print("B) Hit the likely live/channel endpoints unauthenticated")
          print("#" * 72)
          BASE = "https://eu1.tabii.com/apigateway"
          tries = [
              "/content-service/v1/channels", "/content-service/channels",
              "/cms/v1/channels", "/channel-service/v1/channels",
              "/epg-service/v1/epg", "/epg/v1/channels",
              "/livestream-service/v1/channels", "/live/v1/channels",
              "/content/v1/live", "/v1/channels",
          ]
          for t in tries:
              sc, body = get(BASE + t, headers={"Accept": "application/json"})
              snippet = re.sub(r"\s+", " ", (body or ""))[:140]
              print(f"   HTTP {str(sc):<5} {t:<40} {snippet}")

          print()
          print("#" * 72)
          print("C) Turkish sports sites that print 'hangi kanalda'")
          print("#" * 72)
          sites = [
              "https://www.sporx.com/yayin-akisi",
              "https://www.sporx.com/canli-yayin-akisi/",
              "https://www.sporekrani.com/",
              "https://www.mackolik.com/canli-sonuclar",
              "https://www.ntvspor.net/",
              "https://www.fotomac.com.tr/",
              "https://www.tv100.com/spor",
              "https://www.trtspor.com.tr/",
              "https://www.tvyayinakisi.com/kanallar/",
          ]
          for url in sites:
              sc, body = get(url)
              hits = sorted(set(re.findall(r'[Tt]abii\s?[Ss]por\s?\d{0,2}', body or "")))
              print(f"   HTTP {str(sc):<5} tabii-names={hits[:10]!r:<45} {url}")

          print()
          print("#" * 72)
          print("D) Search engines for the exact phrase (who publishes it at all)")
          print("#" * 72)
          for q in ["%22tabii+Spor+3%22", "%22tabii+Spor+7%22"]:
              sc, body = get(f"https://html.duckduckgo.com/html/?q={q}")
              hosts = sorted(set(re.findall(r'uddg=https%3A%2F%2F([a-z0-9\.\-]+)', body or "")))
              print(f"   HTTP {sc} q={q} -> {len(hosts)} hosts")
              for h in hosts[:20]:
                  print("      ", h)
          PY
