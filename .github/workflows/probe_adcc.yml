# Ask whether anybody publishes an ADCC card with a start and a carrier.
# Commits nothing, publishes nothing — it prints.
name: Probe ADCC

on:
  workflow_dispatch:
  push:
    branches: [claude/arabic-channels-epg-99099k]
    paths:
      - "probes/probe_adcc.py"
      - ".github/workflows/probe_adcc.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -u probes/probe_adcc.py
