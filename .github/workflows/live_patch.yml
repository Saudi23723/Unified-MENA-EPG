name: Live names (providers that refuse Cloudflare)

# Strong's and Dream4k's providers refuse the Cloudflare relay's live-list request (403, 28 Oct 2026). This job
# reads their live lists every 15 minutes with the logins kept in the repository secrets (STRONG_URL, DREAM4K_URL:
# the playlist links; never printed) and publishes only the names patch on the "live-patch" branch, which the
# relay reads. A provider that refuses GitHub too is left alone for a day instead of being asked again.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      force_vod:
        description: "Rebuild movies / series now"
        required: false
        default: "0"

permissions:
  contents: write
  actions: write

concurrency:
  group: live-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    # one run keeps going for ~5 hours and refreshes every 10 minutes, then starts the next run: GitHub's own
    # 15-minute timer was delivered only every few hours (29 Oct 2026: names hours old)
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - name: Last results (live-status) and last patches (live-patch)
        run: |
          mkdir -p _status _patch
          git fetch -q --depth 1 origin live-status 2>/dev/null && git --work-tree=_status checkout FETCH_HEAD -- . 2>/dev/null || true
          git fetch -q --depth 1 origin live-patch 2>/dev/null && git --work-tree=_patch checkout FETCH_HEAD -- . 2>/dev/null || true
          git reset -q
      - name: Build the names patches
        env:
          STRONG_HOST: ${{ secrets.STRONG_HOST }}
          STRONG_USER: ${{ secrets.STRONG_USER }}
          STRONG_PASS: ${{ secrets.STRONG_PASS }}
          STRONG_URL: ${{ secrets.STRONG_URL }}
          DREAM4K_URL: ${{ secrets.DREAM4K_URL }}
          ARGON_URL: ${{ secrets.ARGON_URL }}
          UP1_URL: ${{ secrets.UP1_URL }}
          AROMA_URL: ${{ secrets.AROMA_URL }}
          HYDRA_URL: ${{ secrets.HYDRA_URL }}
          FAMILY4K_URL: ${{ secrets.FAMILY4K_URL }}
          FORCE_VOD: ${{ github.event.inputs.force_vod }}
        run: |
          set +e
          end=$(( $(date +%s) + 5*3600 ))
          while :; do
          for p in strong dream4k argon up1 aroma hydra family4k; do
            P=$(echo "$p" | tr a-z A-Z)
            # refused within the last day: do not ask that provider again yet
            if [ -f "_status/$p.txt" ] && grep -q "^exit 3" "_status/$p.txt"; then
              last=$(date -d "$(head -1 "_status/$p.txt")" +%s 2>/dev/null || echo 0)
              if [ $(( $(date +%s) - last )) -lt 86400 ]; then echo "$p: refused recently, skipped"; continue; fi
            fi
            eval "export PROVIDER_HOST=\"\${${P}_HOST:-}\" PROVIDER_USER=\"\${${P}_USER:-}\" PROVIDER_PASS=\"\${${P}_PASS:-}\" PROVIDER_URL=\"\${${P}_URL:-}\""
            [ -z "$PROVIDER_URL$PROVIDER_USER" ] && continue  # no login stored for this playlist
            python tools/live_patch.py "$p" "_new/$p.json" > "_msg_$p.txt" 2>&1
            c=$?
            # what happened, without any login (the script never prints it)
            { date -u; echo "exit $c"; tail -3 "_msg_$p.txt"; } > "_status/$p.txt"
            [ "$c" = 0 ] && [ -f "_new/$p.json" ] && cp "_new/$p.json" "_patch/$p.json"
            # movies / series (the relay cannot read them either): every 2 hours is enough
            age=999999; [ -f "_patch/$p/stamp" ] && age=$(( $(date +%s) - $(cat "_patch/$p/stamp") ))
            if [ "$c" = 0 ] && [ "$age" -gt 7000 -o "${FORCE_VOD:-}" = 1 ]; then
              rm -rf "_vod/$p" && python tools/vod_patch.py "$p" "_vod/$p" > "_vmsg_$p.txt" 2>&1
              v=$?
              tail -2 "_vmsg_$p.txt" >> "_status/$p.txt"; echo "vod exit $v" >> "_status/$p.txt"
              if [ "$v" = 0 ] && [ -f "_vod/$p/vod_categories.json" ]; then
                rm -rf "_patch/$p" && mv "_vod/$p" "_patch/$p" && date +%s > "_patch/$p/stamp"
              fi
            fi
          done
          # publish this round
          for b in status patch; do
            ( cd "_$b" && rm -rf .git && git init -q -b "live-$b" && git add -A \
              && git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "live $b" \
              && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "live-$b" ) || true
          done
          FORCE_VOD=0
          [ $(( $(date +%s) + 600 )) -gt "$end" ] && break
          sleep 600
          done
          exit 0
      - name: Start the next run (keeps the 10-minute refresh going)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run live_patch.yml -R "${{ github.repository }}" --ref main || true
