name: Audit every source
on:
  push:
    paths:
      - "tools/probe_yallakora.py"
      - ".github/workflows/audit_sources.yml"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -u tools/probe_yallakora.py
