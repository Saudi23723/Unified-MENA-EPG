name: Verify the ON Sport fix
on:
  push:
    paths:
      - ".github/workflows/audit_sources.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Build ON Sport
        run: python -u update_onsport_epg.py
      - name: What it published for today
        if: always()
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from collections import Counter
          from datetime import datetime, timedelta, timezone
          CAIRO = timezone(timedelta(hours=3))
          root = ET.parse("onsport_epg.xml").getroot()
          now = datetime.now(timezone.utc)
          rows = []
          for p in root.findall("programme"):
              raw = p.get("start")
              st = datetime.strptime(raw[:14], "%Y%m%d%H%M%S").replace(
                  tzinfo=timezone(timedelta(hours=int(raw[-5:-2]))))
              rows.append((st.astimezone(CAIRO), p.get("channel"),
                           p.findtext("title") or ""))
          today = now.astimezone(CAIRO).date()
          print("channels:", [c.get("id") for c in root.findall("channel")])
          print("programmes:", len(rows))
          c = Counter(t for _s, _c, t in rows)
          print("distinct titles:", len(c))
          for t, k in c.most_common(8):
              print(f"   {k:4}  {t[:80]}")
          print("\nTODAY:")
          for s, cid, t in sorted(r for r in rows if r[0].date() == today):
              print(f"   {s:%H:%M}  {cid:12} {t[:70]}")
          PY
      - name: Does it clear its ceiling now
        if: always()
        run: python -u health_check.py || echo "health_check exit $?"

