name: Count the rows a viewer scrolls
on:
  push:
    paths:
      - "tools/verify_rows.py"
      - ".github/workflows/verify_rows.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -u tools/verify_rows.py
