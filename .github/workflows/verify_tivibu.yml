name: Verify Tivibu Spor

# Research only, and deliberately not on main. The feed answers only from
# inside the countries it serves, so a runner is the one place the new
# generator can be run before it is merged. Read-only, commits nothing,
# deleted once the numbers are confirmed.
on:
  push:
    paths:
      - "tools/verify_tivibu.py"
      - "tivibu_spor_epg.py"
      - ".github/workflows/verify_tivibu.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python tools/verify_tivibu.py
