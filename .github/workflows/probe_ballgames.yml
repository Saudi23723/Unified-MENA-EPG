# Where today's live MLB and NFL games go, between ESPN and the board.
#
# It commits nothing and publishes nothing.
name: Probe ball games

on:
  workflow_dispatch:
  push:
    branches: [claude/arabic-channels-epg-99099k]
    paths:
      - "probes/probe_ballgames.py"
      - ".github/workflows/probe_ballgames.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -u probes/probe_ballgames.py
