name: Probe aviation data sources
on:
  push:
    paths:
      - '.github/workflows/probe_aviation_sources.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Airport codes and chart zooms
        run: |
          Q="https://services6.arcgis.com/ssFJjBXIUyZDrSYZ/arcgis/rest/services/US_Airport/FeatureServer/0/query"
          curl -sS -m 30 "$Q?where=STATE%3D%27NV%27&outFields=TYPE_CODE,PRIVATEUSE&returnDistinctValues=true&returnGeometry=false&f=json" | head -c 1500; echo
          curl -sS -m 30 "$Q?where=STATE%3D%27NV%27%20AND%20TYPE_CODE%3D%27AD%27%20AND%20PRIVATEUSE%3D0&returnCountOnly=true&f=json"; echo
          curl -sS -m 30 "$Q?where=STATE%3D%27CA%27%20AND%20TYPE_CODE%3D%27AD%27%20AND%20PRIVATEUSE%3D0&outFields=IDENT,ICAO_ID,NAME,ELEVATION,SERVCITY&returnGeometry=true&outSR=4326&f=json&resultRecordCount=2" | head -c 1500; echo
          for s in VFR_Sectional VFR_Terminal IFR_AreaLow; do
            echo "$s:"; curl -sS -m 30 "https://tiles.arcgis.com/tiles/ssFJjBXIUyZDrSYZ/arcgis/rest/services/$s/MapServer?f=json" | python3 -c 'import json,sys;d=json.load(sys.stdin);l=d["tileInfo"]["lods"];print("levels",l[0]["level"],"-",l[-1]["level"],"rows",d["tileInfo"]["rows"],"fmt",d["tileInfo"]["format"])'
          done
          for z in 12 13; do curl -sS -m 30 -o t.bin -w "TAC z$z %{http_code} " "https://tiles.arcgis.com/tiles/ssFJjBXIUyZDrSYZ/arcgis/rest/services/VFR_Terminal/MapServer/tile/$z/$((1622*2**(z-12)))/$((723*2**(z-12)))"; stat -c %s t.bin; done
