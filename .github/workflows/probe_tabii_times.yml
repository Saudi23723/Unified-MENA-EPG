name: Probe — tabii times and live flag
on:
  push:
    paths:
      - "probes/probe_tabii_times.py"
      - ".github/workflows/probe_tabii_times.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: What TRT actually prints
        run: python -u probes/probe_tabii_times.py
