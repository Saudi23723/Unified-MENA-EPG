name: What times does Spor Ekrani really publish for tabii
on:
  push:
    branches: [claude/arabic-channels-epg-99099k]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - name: Probe
        run: |
          python -u - <<'PY'
          import json, re, requests
          from datetime import datetime, timedelta, timezone
          TR = timezone(timedelta(hours=3))
          H = {"User-Agent": ("Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 "
               "(KHTML, like Gecko) Chrome/126.0 Safari/537.36"),
               "Accept-Language": "tr,en;q=0.9"}

          print("="*88)
          print("RAW startDate/endDate straight from Spor Ekrani, per tabii channel")
          print("="*88)
          s = requests.get("https://www.sporekrani.com/", headers=H, timeout=30).text
          evs=[]
          def walk(n):
              if isinstance(n, dict):
                  if n.get("@type") in ("BroadcastEvent","Event"): evs.append(n)
                  for v in n.values(): walk(v)
              elif isinstance(n, list):
                  for v in n: walk(v)
          for b in re.findall(r'<script type="application/ld\+json"[^>]*>(.*?)</script>', s, re.S):
              try: walk(json.loads(b))
              except Exception: pass

          def iso(v):
              try: return datetime.fromisoformat(v)
              except Exception: return None

          rows=[]
          for e in evs:
              pub = e.get("publishedOn") or {}
              name = pub.get("name") if isinstance(pub,dict) else None
              if not name or "tabii" not in name.casefold(): continue
              of = e.get("broadcastOfEvent") or {}
              a, b = iso(of.get("startDate","")), iso(of.get("endDate",""))
              rows.append((name, a, b, of.get("name"), of.get("startDate"), of.get("endDate")))

          rows.sort(key=lambda r: (r[0], str(r[1])))
          print(f"\n{len(rows)} tabii broadcasts listed today\n")
          for name,a,b,title,ra,rb in rows:
              mins = (b-a).total_seconds()/60 if a and b else None
              print(f"  {name:<14} {a.astimezone(TR):%m-%d %H:%M}->{b.astimezone(TR):%H:%M} TR "
                    f"({mins:>4.0f}m)  {str(title)[:44]}")
              print(f"       raw: {ra}  ->  {rb}")

          print()
          print("="*88)
          print("Do any two broadcasts on the SAME channel overlap at the source?")
          print("="*88)
          from collections import defaultdict
          byc=defaultdict(list)
          for name,a,b,title,_,_ in rows:
              if a and b: byc[name].append((a,b,title))
          for name, items in sorted(byc.items()):
              items.sort()
              clashes=0
              for (a1,b1,t1),(a2,b2,t2) in zip(items, items[1:]):
                  if a2 < b1:
                      clashes+=1
                      print(f"  {name}: OVERLAP  '{str(t1)[:30]}' ends {b1.astimezone(TR):%H:%M} "
                            f"but '{str(t2)[:30]}' starts {a2.astimezone(TR):%H:%M}")
              if not clashes:
                  print(f"  {name}: no overlap among {len(items)} broadcast(s)")
          PY
