name: Verify the one-build orchestrator
on:
  push:
    paths:
      - ".github/workflows/verify_build_all.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the OCR engine
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ara tesseract-ocr-eng
          tesseract --list-langs
          tesseract --list-langs | grep -qx ara
          tesseract --list-langs | grep -qx eng
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build every guide, then merge them
        run: python -u build_all_epg.py
      - name: What changed, and does it still hold together
        if: always()
        run: |
          echo "--- files the build rewrote ---"
          git status --short -- '*.xml'
          echo "--- structural health of every guide ---"
          python -u health_check.py --structure-only
          echo "--- full health, freshness included (advisory here) ---"
          python -u health_check.py || echo "health_check exit $?"
