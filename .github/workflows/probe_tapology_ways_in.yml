# Try every door into tapology, and ask sporteventz whether it names the
# broadcaster. Commits nothing, publishes nothing — it prints.
name: Probe the ways into tapology

on:
  workflow_dispatch:
  push:
    branches: [claude/arabic-channels-epg-99099k]
    paths:
      - "probes/probe_tapology_ways_in.py"
      - ".github/workflows/probe_tapology_ways_in.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -u probes/probe_tapology_ways_in.py
