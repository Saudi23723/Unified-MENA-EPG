name: Update STARZPLAY Sports EPG

on:
  # Scheduled builds all live in one workflow now — "Build every EPG",
  # which runs this guide's generator along with every other one. See
  # build_all_epg.py for why: fifteen separate crons had GitHub delaying
  # and dropping this repository's scheduled events for hours at a time.
  #
  # This file is kept as the way to rebuild THIS guide on its own, by
  # hand, when something about it needs looking at. It is not part of the
  # regular schedule and nothing chains to it.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: starzplay-epg
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate STARZPLAY Sports EPG
        run: python starzplay_epg.py

      - name: Validate XMLTV
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from datetime import datetime

          root = ET.parse("starzplay_epg.xml").getroot()
          assert root.tag == "tv"
          assert root.find("channel") is not None, "no channels"

          last = {}
          for pr in root.findall("programme"):
              ch = pr.get("channel")
              st = datetime.strptime(pr.get("start"), "%Y%m%d%H%M%S %z")
              sp = datetime.strptime(pr.get("stop"), "%Y%m%d%H%M%S %z")
              assert sp > st, f"bad duration on {ch}"
              assert ch not in last or st >= last[ch], f"overlap on {ch}"
              last[ch] = sp
          print("STARZPLAY Sports XMLTV VALIDATION PASS")
          PY

      - name: Commit updated EPG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add starzplay_epg.xml

          if git diff --cached --quiet; then
            echo "No STARZPLAY Sports EPG changes to commit."
            exit 0
          fi

          git commit -m "Update STARZPLAY Sports EPG"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin main; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push rejected (another workflow pushed first), retrying ($attempt/5)..."
            sleep $(( (RANDOM % 5) + 2 ))
          done
          echo "Failed to push after 5 attempts"
          exit 1
