name: Verify beIN Türkiye

# Research only, and deliberately not on main. Builds on a runner because
# the Turkish hosts refuse requests from anywhere else, writes into a
# scratch directory, and commits nothing. Deleted once confirmed.
on:
  push:
    paths:
      - "tools/verify_bein_tr.py"
      - "bein_sports_turkey_epg.py"
      - ".github/workflows/verify_bein_tr.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python tools/verify_bein_tr.py
