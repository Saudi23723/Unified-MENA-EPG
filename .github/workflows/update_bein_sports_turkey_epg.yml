name: Update beIN Sports Türkiye EPG

on:
  workflow_dispatch:
  schedule:
    - cron: "25 */2 * * *"
  push:
    branches:
      - main
    paths:
      - "bein_sports_turkey_epg.py"
      - "epg_lib.py"
      - ".github/workflows/update_bein_sports_turkey_epg.yml"

permissions:
  contents: write

concurrency:
  group: bein-sports-turkey-epg
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate beIN Sports Türkiye EPG
        run: python bein_sports_turkey_epg.py

      - name: Validate XMLTV
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse("bein_sports_turkey_epg.xml").getroot()
          assert root.tag == "tv"
          assert root.find("channel") is not None
          print("beIN SPORTS TÜRKİYE XMLTV VALIDATION PASS")
          PY

      - name: Commit updated EPG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add bein_sports_turkey_epg.xml

          if git diff --cached --quiet; then
            echo "No beIN Sports Türkiye EPG changes to commit."
            exit 0
          fi

          git commit -m "Update beIN Sports Türkiye EPG"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin main; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push rejected (another workflow pushed first), retrying ($attempt/5)..."
            sleep $(( (RANDOM % 5) + 2 ))
          done
          echo "Failed to push after 5 attempts"
          exit 1
