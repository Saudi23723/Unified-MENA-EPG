name: Update Al Jazeera EPG

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "aljazeera_epg.py"
      - ".github/workflows/update_aljazeera_epg.yml"

  # Al Jazeera renders one day at a time, so the guide accumulates: run
  # often enough that a new day is picked up soon after it appears.
  schedule:
    - cron: "5 * * * *"

permissions:
  contents: write

concurrency:
  group: aljazeera-epg
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build XMLTV
        run: python aljazeera_epg.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add aljazeera_epg.xml

          if git diff --cached --quiet; then
            echo "No Al Jazeera EPG changes to commit."
            exit 0
          fi

          git commit -m "Update Al Jazeera EPG"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin main; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push rejected (another workflow pushed first), retrying ($attempt/5)..."
            sleep $(( (RANDOM % 5) + 2 ))
          done
          echo "Failed to push after 5 attempts"
          exit 1
