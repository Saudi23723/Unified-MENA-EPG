name: Trending titles (TMDB)

# The Home showcase's "trending / box office / top rated" lists. Needs the repository secret TMDB_KEY
# (a free key from themoviedb.org); without it the job does nothing and the app shows the playlist's own lists.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trending
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build trending.json
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
        run: python tools/trending.py
      - name: Publish
        run: |
          [ -f trending.json ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trending.json
          git diff --cached --quiet && exit 0
          git commit -m "Update trending titles"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 5; done
          exit 1
