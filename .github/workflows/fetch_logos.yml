name: Fetch channel logos (manual)

# Manual only. Run this when a channel logo needs to be added or refreshed;
# it downloads the logos from their upstream sources, validates each one is
# a real image, and commits them into logos/ so the guides can serve them
# from this repository instead of hot-linking a third-party host.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-logos
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow

      - name: Download and validate logos
        run: python fetch_logos.py

      - name: Commit logos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add logos

          if git diff --cached --quiet; then
            echo "No logo changes to commit."
            exit 0
          fi

          git commit -m "Update channel logos"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin main; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push rejected (another workflow pushed first), retrying ($attempt/5)..."
            sleep $(( (RANDOM % 5) + 2 ))
          done
          echo "Failed to push after 5 attempts"
          exit 1
