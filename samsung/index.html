<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920,height=1080">
<title>SAUDI.TV</title>
<script src="$WEBAPIS/webapis/webapis.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#070a12;color:#fff;font-family:"SamsungOne","Segoe UI",Roboto,Arial,sans-serif}
body.playing{background:transparent}
#av{position:absolute;left:0;top:0;width:1920px;height:1080px}
.screen{position:absolute;inset:0;display:none;padding:56px 72px;background:#070a12}
.screen.on{display:block}
body.playing .screen{background:transparent}
h1{margin:0 0 6px;font-size:40px;letter-spacing:.14em}h1 b{color:#10b981}
.sub{color:#8b95a9;font-size:24px;margin-bottom:30px}
.row{display:flex;gap:24px;flex-wrap:wrap}
.card{flex:1 1 300px;height:230px;border-radius:28px;background:#131a2a;padding:30px;font-size:38px;font-weight:700;display:flex;align-items:flex-end;border:4px solid transparent}
.card small{display:block;font-size:22px;color:#8b95a9;font-weight:400;margin-top:6px}
.f{border-color:#10b981!important;background:#16324a!important}
.cols{display:flex;gap:26px;height:900px}
.list{overflow:hidden;height:100%}
.list .it{height:68px;line-height:68px;padding:0 22px;margin-bottom:8px;border-radius:14px;background:#111827;font-size:27px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:3px solid transparent}
.list .it .n{color:#8b95a9;margin-right:16px;font-size:22px}
#groups{width:560px}#chans{flex:1}
.grid{display:flex;flex-wrap:wrap;gap:18px;align-content:flex-start;overflow:hidden;height:100%}
.grid .it{width:226px;height:400px;border-radius:14px;background:#111827;border:4px solid transparent;overflow:hidden;font-size:20px}
.grid .it img{width:100%;height:330px;object-fit:cover;display:block;background:#0b1020}
.grid .it div{padding:8px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#code{font:700 96px monospace;letter-spacing:.14em;color:#10b981;margin:30px 0}
#osd{position:absolute;left:72px;right:72px;bottom:56px;padding:26px 34px;border-radius:20px;background:rgba(7,10,18,.86);font-size:34px;font-weight:700;display:none}
#osd small{display:block;font-size:24px;color:#b6bfd0;font-weight:400;margin-top:6px}
#toast{position:absolute;left:50%;top:60px;transform:translateX(-50%);background:#111827;padding:16px 30px;border-radius:14px;font-size:26px;display:none}
</style>
</head>
<body>
<object id="av" type="application/avplayer"></object>

<div class="screen" id="s-setup"><h1>SAUDI<b>.TV</b></h1><div class="sub">Give this code to your provider</div><div id="code"></div><div class="sub" id="setup-st">Waiting for activation…</div></div>

<div class="screen" id="s-home"><h1>SAUDI<b>.TV</b></h1><div class="sub" id="hello"></div>
  <div class="row" id="home"></div><div class="sub" id="foot" style="position:absolute;left:72px;bottom:40px;margin:0;font-size:20px"></div></div>

<div class="screen" id="s-live"><div class="cols"><div class="list" id="groups"></div><div class="list" id="chans"></div></div></div>

<div class="screen" id="s-vod"><div class="cols"><div class="list" id="cats" style="width:520px"></div><div class="grid" id="posters" style="flex:1"></div></div></div>

<div class="screen" id="s-eps"><h1 id="eps-t" style="font-size:34px;letter-spacing:0"></h1><div class="list" id="eps" style="height:920px;margin-top:20px"></div></div>

<div id="osd"></div><div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
