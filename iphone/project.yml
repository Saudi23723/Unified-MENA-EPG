# SAUDI.TV for iPhone / iPad (owner, 25 Nov 2026). Built by .github/workflows/saudi1_ios.yml with XcodeGen.
name: SAUDI1
options:
  bundleIdPrefix: com.saudi1
  deploymentTarget:
    iOS: "15.0"
targets:
  SAUDI1:
    type: application
    platform: iOS
    sources: [Sources]
    resources: [Assets.xcassets]
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: SAUDI.TV
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIBackgroundModes: [audio]
        # every provider sends http video (25 Nov 2026): the app may load it (this is why the app exists)
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsArbitraryLoadsForMedia: true
          NSAllowsArbitraryLoadsInWebContent: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.saudi1.tv
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: "1"
